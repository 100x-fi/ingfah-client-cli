            at most 45 characters.
          example: 203.150.12.4
          type: string
        user_agent:
          description: The raw User-Agent header as stored (its first 1,024 characters);
            the client parses it.
          example: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,
            like Gecko) Chrome/130.0.0.0 Safari/537.36
          type: string
      required:

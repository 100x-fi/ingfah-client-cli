    CrmCreateUserBody:
      properties:
        client_external_id:
          description: 'The customer''s id in the client''s own system, 1 to 255 characters.
            Sent: the user is found by it before phone, so a customer who changes
            number stays the same CRM user, and phone (optional then) becomes the
            user''s number. No user has it yet: the user with this phone and no client_external_id
            takes it; with neither, a new user is added. Not sent: the user is found
            by phone, which is then required.'
          example: C-1029
          nullable: true
          type: string
        do_not_contact:
          description: 'Absent: false for a new number, kept as stored for an existing
            one. false also clears do_not_contact_until, even when the request sends
            one.'
          example: true
          nullable: true
          type: boolean
        do_not_contact_until:
          description: 'Unix seconds. After it passes, do_not_contact no longer applies.
            Absent: none for a new number, kept as stored for an existing one. null:
            clears a stored one, so do_not_contact applies for good.'
          nullable: true
          type: integer
        metadata:
          additionalProperties: {}
          description: 'An object. A new number stores it without the keys sent as
            null. For an existing one it is merged into the stored metadata key by
            key, as PATCH /crm/user does. Absent or null: kept as stored for an existing
            number. Not an object is 400.'
          type: object
        name:
          example: Somchai
          nullable: true
          type: string
        phone:
          description: Thai phone number; stored normalised. Required unless client_external_id
            is sent. A number that belongs to another CRM user of the client (one
            with another client_external_id) is 409.
          example: "0812345678"
          type: string
      type: object
    CrmCrmUser:
      properties:
        client_external_id:
          description: The customer's id in the client's own system; null when never
            sent.
          example: C-1029
          nullable: true
          type: string
        created_at:
          description: When the user was added, in UTC.
          format: date-time
          type: string
        do_not_contact:
          type: boolean
        do_not_contact_until:
          format: date-time
          nullable: true
          type: string
        id:
          description: The CRM user's id, a uuid. It stays the same when the user
            is updated.
          example: 6f1c2a4e-8b0d-4c3f-9a51-2e7d90b4c812
          type: string
        metadata: {}
        name:
          nullable: true
          type: string
        phone:
          description: Masked (e.g. 668xxxx5678) for operators when PII censoring
            is on, in every CRM user response, and for API keys an operator created;
            owners and their API keys see it in full.
          nullable: true
          type: string
        updated_at:
          description: 'When the user was last written, in UTC: every create or update
            call moves it, even one that changes nothing.'
          format: date-time
          type: string
      required:
      - id
      - do_not_contact
      - metadata
      - created_at
      - updated_at
      type: object
    CrmUpdateUserBody:
      properties:
        client_external_id:
          description: 'The customer''s id in the client''s own system, 1 to 255 characters.
            Sent: the user to update is the one with it (404 if none), and phone,
            optional then, becomes its new number. Not sent: the user to update is
            the one with phone.'
          example: C-1029
          nullable: true
          type: string
        do_not_contact:
          description: false takes the number off the do-not-contact list and clears
            do_not_contact_until, even when the request sends one.
          example: false
          nullable: true
          type: boolean
        do_not_contact_until:
          description: 'Unix seconds. After it passes, do_not_contact no longer applies.
            Absent: unchanged. null: clears the stored one, so do_not_contact applies
            for good.'
          nullable: true
          type: integer
        metadata:
          additionalProperties: {}
          description: 'An object merged into the stored metadata key by key: a key
            sent replaces the stored one, a key sent as null is removed, keys not
            sent are kept. Nested objects are replaced whole. Absent or null: unchanged.
            Not an object is 400.'
          type: object
        name:
          example: Somchai
          nullable: true
          type: string
        phone:
          description: Thai phone number of the CRM user to update, or its new number
            when client_external_id is sent. Required unless client_external_id is
            sent. A new number that belongs to another CRM user of the client is 409.
          example: "0812345678"
          type: string
      type: object
    CrmUpdateUserByIDBody:
      properties:
        client_external_id:
          description: 'The user''s new id in the client''s own system, 1 to 255 characters;
            null removes it. Empty or over 255 characters is 400. One another CRM
            user of the client has is 409 ("the client_external_id belongs to another
            CRM user"). Absent: unchanged.'
          example: C-2001
          nullable: true
          type: string
        do_not_contact:
          description: false takes the number off the do-not-contact list and clears
            do_not_contact_until, even when the request sends one.
          example: true
          nullable: true
          type: boolean
        do_not_contact_until:
          description: 'Unix seconds. After it passes, do_not_contact no longer applies.
            Absent: unchanged. null: clears the stored one, so do_not_contact applies
            for good.'
          nullable: true
          type: integer
        metadata:
          additionalProperties: {}
          description: 'An object merged into the stored metadata key by key, as PATCH
            /crm/user does. Absent or null: unchanged. Not an object is 400.'
          type: object
        name:
          example: Somchai
          nullable: true
          type: string
        phone:
          description: 'The user''s new Thai phone number; stored normalised. Not
            a Thai phone number is 400. A number another CRM user of the client has
            is 409 ("the phone belongs to another CRM user"). Absent: unchanged.'
          example: "0898765432"
          type: string
      type: object

    ChatsessionsDetail:
      properties:
        admin_monitors:
          description: The client admins who joined the call or ended it by hand.
          items:
            $ref: '#/components/schemas/ChatsessionsMonitor'
          nullable: true
          type: array
        child_sessions:
          description: 'One session per staff number a warm transfer of this call
            dialed, oldest first, each in the shape of this response: its customer_phone
            is the staff number, its end_reason how that number ended, its messages
            the brief (assistant = the AI, user = the staff member), masked for operators
            with this session''s PII terms. [] when the call had no transfer, and
            always [] in a child.'
          items:
            $ref: '#/components/schemas/ChatsessionsDetail'
          nullable: true
          type: array
        client_outbound_batch:
          allOf:
          - $ref: '#/components/schemas/ChatsessionsSourceBatch'
          description: The outbound batch that placed the call. null for inbound calls,
            and for an outbound call until it has ended.
          nullable: true
          type: object
        client_phone:
          example: "+6621234567"
          type: string
        conversation_id:
          description: The UUID of the text chat conversation the session belongs
            to, as conversation_id in List text chat sessions. null for a call.
          example: 5b2d9a70-3c41-4e8f-9d10-222222222222
          nullable: true
          type: string
        customer_phone:
          description: 'Masked for operators when PII censoring is on. In child_sessions:
            the staff number the transfer dialed, as stored, never masked.'
          example: "+66812345678"
          type: string
        direction:
          enum:
          - inbound
          - outbound
          example: inbound
          type: string
        disposition_outcome:
          description: What the call came to; absent when there is none.
          example: สนใจสินค้า
          nullable: true
          type: string
        disposition_outcome_updated_admin:
          $ref: '#/components/schemas/ChatsessionsUpdatedAdmin'
        disposition_outcome_updated_at:
          description: When the outcome was last set, by the team's disposition postprocessor
            or by an admin's correction (disposition_outcome_updated_admin then names
            the admin); absent while there is none.
          nullable: true
          type: string
        end_reason:
          description: Why the session ended, as stored and not mapped; null when
            none was stored. In child_sessions it is the voice agent's reason for
            that number, e.g. merged_to_caller_room when the staff member accepted,
            or human agent did not answer within 20s (SIP 480).
          example: merged_to_caller_room
          nullable: true
          type: string
        end_time:
          description: Absent while the call is ongoing.
          example: "2026-05-25T11:20:07Z"
          nullable: true
          type: string
        ended_by:
          description: 'Who ended the session: caller = the customer, agent = the
            AI agent, human_agent = an admin or supervisor in the call, or the admin
            who ended the chat, system = nobody that can be named, as for a chat the
            idle timeout or the provider closed; null when it was not reported.'
          enum:
          - caller
          - agent
          - human_agent
          - system
          example: caller
          nullable: true
          type: string
        has_audio_record:
          description: 'A recording is in storage: the record operations will answer.'
          example: true
          type: boolean
        id:
          description: The session's UUID.
          example: 9f1c7e2a-1b3d-4c5e-8a90-111111111111
          type: string
        messages:
          description: The transcript, spoken lines and tool calls, in order.
          items:
            $ref: '#/components/schemas/ChatsessionsMessage'
          nullable: true
          type: array
        outcome_metadata:
          description: The structured fields the team's outcome_metadata postprocessor
            extracted; null when there is none.
        start_time:
          example: "2026-05-25T11:05:00Z"
          type: string
        summary:
          description: The model's summary of the call, from the team's summary postprocessor;
            null until the call ends or when the team has none.
          example: The customer asked when their policy renews and agreed to a call
            back on Monday.
          nullable: true
          type: string
        title:
          description: What the call was about, written by the model once the call
            ends; null until then.
          example: 'Inbound: policy renewal'
          nullable: true
          type: string
      required:
      - id
      - outcome_metadata
      - direction
      - client_phone
      - customer_phone
      - start_time
      - messages
      - admin_monitors
      - disposition_outcome_updated_admin
      - has_audio_record
      - child_sessions
      type: object

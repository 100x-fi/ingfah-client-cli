  /client/products/{id}/postprocessors:
    post:
      description: |-
        Adds a step that runs on each of the team's conversations once it ends. The body depends on `type`: `disposition` picks one of the `disposition_outcomes` given here; `outcome_metadata` extracts the fields of `json_schema`. A team has at most one postprocessor of each type (409). The model settings (llm_provider, llm_model, llm_params, priority) are not the client's to set and are rejected.

        API key scope: `client_products:write`.
      operationId: createProductPostprocessor
      parameters:
      - description: The AI team's id.
        in: path
        name: id
        required: true
        schema:
          description: The AI team's id.
          example: 12
          minimum: 0
          type: integer
      requestBody:
        content:
          application/json:
            examples:
              disposition:
                summary: disposition
                value:
                  disposition_outcomes:
                  - color: '#00BBA7'
                    outcome: สนใจสินค้า
                    prompt: The customer wants to hear more or asks for a call back
                    rank: 1
                  - color: '#FF637E'
                    outcome: ไม่สนใจสินค้า
                    prompt: The customer declines
                    rank: 2
                  instruction: Pick the outcome from what the customer said last
                  type: disposition
              outcome_metadata:
                summary: outcome metadata
                value:
                  instruction: Extract the lead's details
                  json_schema:
                    name: lead
                    schema:
                      properties:
                        budget:
                          type: number
                        callback_date:
                          type: string
                      type: object
                  type: outcome_metadata
            schema:
              $ref: '#/components/schemas/CreateProductPostprocessorBody'
      responses:
        "200":
          content:
            application/json:
              examples:
                disposition:
                  summary: disposition
                  value:
                    data:
                      created_at: "2026-05-25T11:05:00Z"
                      disposition_outcomes:
                      - color: '#00ff00'
                        outcome: Sold
                        prompt: the customer bought
                        rank: 1
                      - color: '#ff0000'
                        outcome: Not interested
                        prompt: the customer declined
                        rank: 2
                      id: 41
                      instruction: Pick the outcome
                      is_enabled: true
                      type: disposition
                      updated_at: "2026-09-04T11:03:00Z"
                    status: success
                outcome_metadata:
                  summary: outcome metadata
                  value:
                    data:
                      created_at: "2026-05-25T11:05:00Z"
                      disposition_outcomes: null
                      id: 41
                      instruction: Extract the lead
                      is_enabled: false
                      json_schema:
                        description: ""
                        name: lead
                        schema:
                          properties:
                            budget:
                              type: number
                          type: object
                      type: outcome_metadata
                      updated_at: "2026-09-04T11:03:00Z"
                    status: success
              schema:
                $ref: '#/components/schemas/PostprocessorData'
          description: OK
        "400":
          content:
            application/json:
              example:
                data:
                  message: json_schema.name is required
                  rule: name_invalid
                error: bad request
                status: error
              schema:
                $ref: '#/components/schemas/ProductsPostprocessorError'
          description: Bad Request
        "401":
          content:
            application/json:
              example:
                error: unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                error: resource not found
                errors:
                - code: PRODUCT_NOT_FOUND
                  detail: product not found
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Not Found
        "409":
          content:
            application/json:
              example:
                error: conflict
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Conflict
      security:
      - apiKey: []
      summary: Create postprocessor
      tags:
      - AI team postprocessors

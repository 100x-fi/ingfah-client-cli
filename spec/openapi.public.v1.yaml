    post:
      description: |-
        Creates a Public Link for one top-level call (resource_type chat_session, chat_type audio or call) or for a whole text chat conversation (resource_type text_chat_conversation, chat sessions that start after the link is made included) of the caller's client. The caller must be an owner now, by the role on its admin's row (for an API key, its creator's), never the role in the token: an operator, a demoted owner, or a key whose creator is an operator answers 403; a JWT or key whose admin no longer exists answers 401. A guest cannot create a link, whatever role it was granted, and neither can an API key whose creator is a guest: 403 "guest admins cannot create share links", checked before the owner check. A guest owner still lists, views and revokes links. A warm-transfer child session, another client's resource or an unknown id answers 404. A text chat session answers 400 SHARE_LINK_USE_CONVERSATION: share its conversation instead (a legacy text session with no conversation answers the same and cannot be shared). A public link needs expires_at; a pin link may leave it out or null (never expires). expires_at is truncated to whole seconds and must be later than now and <= 23:59:59 Asia/Bangkok of (today + 90 days), else 400 SHARE_LINK_EXPIRY_INVALID. pin is a string of exactly 6 digits 0-9, pin links only; null or left out generates one; sent with kind public, or not 6 digits, 400 SHARE_LINK_PIN_INVALID (a non-string pin is a bad body). At most 10 active links per call or conversation (expired and revoked links do not count; links of a deleted API key do), counted under an advisory lock, else 400 SHARE_LINK_LIMIT_REACHED. The checks run in order and the first failure answers: 401/403 (auth), 400 (bad body; SHARE_LINK_RESOURCE_INVALID for a resource_type not one of the two or a resource_id not a UUID), 404, 400 (kind, expiry, pin, limit). The token is 32 random bytes, base64url without padding (43 characters); url carries it and pin is the PIN; both are logged redacted. Writes one chat_session.share_link_create activity log row, for a conversation link too; metadata.entity.type tells them apart and an API key adds metadata.api_key_name. Cache-Control is no-store.

        API key scope: `share_links:write`.
      operationId: createShareLink
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharelinksCreateBody'

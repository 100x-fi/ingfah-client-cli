    OutboundPatchRecordBody:
      properties:
        customer_context:
          additionalProperties: {}
          description: Keys to change in the record's customer data, which the AI
            agent reads as customerContext. A key is saved into required_data, which
            wins over optional_data; a key whose value is null is removed from both.
            Keys not sent stay as they are.
          example:
            note: null
            overdue_amount: "5000"
          type: object
        lease_until:
          description: 'RFC 3339; required with status callback and refused otherwise:
            when to call the row back. Must be in the future, and no later than 7
            days after the batch''s last schedule end_time (409).'
          example: "2026-10-16T15:00:00+07:00"
          nullable: true
          type: string
        status:
          description: 'dnc: never call the row again; dnc is final. callback: call
            the row back at lease_until, under the same checks as a callback the customer
            booked: the batch''s callback_window_mode is exact and the row has a callback
            left (callback_attempts < max_callbacks). Refused (409) while the row
            is on the line, once it is dnc, or when a check fails.'
          enum:
          - dnc
          - callback
          example: callback
          nullable: true
          type: string
      type: object
    OutboundProgress:
      properties:

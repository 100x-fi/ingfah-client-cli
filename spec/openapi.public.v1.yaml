  /client/calls/inbound-admission:
    get:
      description: |-
        Asks whether we can take one more inbound call now, before you transfer one to us over SIP. API key only: a dashboard session is a 401. A full line is a 200 with allow false, not an error; a check that cannot finish is a 500.

        How to act on the answer:

        ```
        allow = true            → transfer the call over SIP, the line is not held until the call arrives
        allow = false           → send the call to a person
        non-200 or no answer    → send the call to a person
        call refused after a check that said allow = true → send it to a person
        ```

        A client whose license has expired is refused with a 403.

        API key scope: `inbound_admission:read`.
      operationId: getInboundAdmission
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundAdmissionData'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Internal Server Error
      security:
      - apiKey: []
      summary: Check whether an inbound call can be taken now
      tags:
      - Inbound calls
  /client/chat-conversations/{uuid}:
    put:
      description: |-
        Turns the AI on or off for one conversation, named by its UUID. Turning it on releases whoever answers by hand. From a dashboard session, turning it off makes the caller the one who answers by hand. With an API key the body may carry only bot_enabled (anything else is a 400), turning the AI off leaves whoever answers by hand as they are, and sending the value the conversation already has changes nothing. Another client's conversation is a 404; an id that is not a UUID is a 400.

        API key scope: `text_chat_conversations:write`.
      operationId: setTextChatConversationBot
      parameters:
      - description: The conversation's UUID.

          description: Defaults to 1.
          example: 1
          nullable: true
          type: integer
      - description: Defaults to 20, at most 100.
        in: query
        name: per_page
        schema:
          description: Defaults to 20, at most 100.
          example: 20
          nullable: true
          type: integer
      - description: Partial match on name and description.
        in: query
        name: search
        schema:
          description: Partial match on name and description.
          example: handoff
          nullable: true
          type: string
      - description: Comma-separated tool ids.
        in: query
        name: ids
        schema:
          description: Comma-separated tool ids.
          example: 1,2,3
          nullable: true
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - client_id: null
                  description: Hand the chat to a human staff member. Call this when
                    the customer asks for a person, or when you cannot answer safely.
                  id: 1
                  name: handoff_to_human
                  params:
                    properties:
                      reason:
                        description: 'Why the chat goes to a human: the customer asked
                          for a person, you cannot answer, or the topic is sensitive'
                        enum:
                        - customer_requested_human
                        - cannot_answer
                        - sensitive_topic
                        type: string
                      summary:

              $ref: '#/components/schemas/FormDataTtsdictionariesImportBody'
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  added: 1
                  unchanged: 1
                  updated: 1
                status: success
              schema:
                $ref: '#/components/schemas/ImportResultData'
          description: OK
        "400":
          content:
            application/json:
              example:
                data:
                  invalid_row_count: 2
                  rows:
                  - code: PRONUNCIATION_EMPTY
                    row: 7
                  - code: DUPLICATE_IN_FILE
                    duplicate_of_row: 4
                    row: 12
                error: bad request
                errors:
                - code: TTS_DICTIONARY_INVALID_ROWS
                  detail: 2 invalid rows
                status: error
              schema:
                $ref: '#/components/schemas/TtsdictionariesImportError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Not Found
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Request Entity Too Large
      security:
      - apiKey: []
      summary: Import words into a TTS dictionary from CSV
      tags:
      - TTS dictionaries
  /client/tts-dictionaries/{id}/words:
    get:
      description: |-

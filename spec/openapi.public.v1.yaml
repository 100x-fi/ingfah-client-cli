                  created_at: "2026-09-24T03:00:00.120Z"
                  customer_phone: "+66812345678"
                  outbound_batch_record_id: 9087
                  row_number: 1
                  sip_answered_at: null
                  sip_disposition: BUSY
                  sip_ended_at: "2026-09-24T03:00:31.480Z"
                  sip_hangup_cause:
                    q850: "17"
                    sip: SIP 486 Busy Here
                  sip_started_at: "2026-09-24T03:00:01.480Z"
                  status: missed
                  status_reason: null
                  updated_at: "2026-09-24T03:00:32.010Z"
                pagination:
                  has_next: false
                  has_prev: false
                  page: 1
                  per_page: 20
                  total: 1
                  total_pages: 1
                status: success
              schema:
                $ref: '#/components/schemas/CallDataRecordPage'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Bad Request
        "401":
          content:
            application/json:
              example:
                error: unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Unauthorized
      security:
      - apiKey: []
      summary: List outbound call data records
      tags:
      - Outbound batches

    get:
      description: |-
        Every Public Link of one top-level call (resource_type chat_session, chat_type audio or call) or of one text chat conversation (resource_type text_chat_conversation) of the caller's client, made by any owner or API key. The caller must be an owner now, by the role on its admin's row (a guest's granted role, or an API key's creator), never the role in the token: an operator, a demoted owner, or a key whose creator is an operator answers 403; a JWT or key whose admin no longer exists answers 401. chat_sessions:read is not enough for an API key. resource_type missing or not one of the two, or resource_id missing or not a UUID, answers 400 SHARE_LINK_RESOURCE_INVALID before any lookup. Another client's resource, a warm-transfer child session, an unknown id or an id of the other type answers 404, never 403. A text chat session answers 400 SHARE_LINK_USE_CONVERSATION: its links are on the conversation. status is computed per request: revoked when revoked_at is set; else expired when expires_at <= now; else active. url is always set, so an expired or revoked link's URL can still be shown; it no longer opens (GET /share answers 404 SHARE_LINK_NOT_AVAILABLE). pin is set only while a pin link is active, so it can be copied again; null otherwise. Active links first, newest first; then expired and revoked links together, newest first. No paging and no cap on purpose: at most 10 links are active, expired and revoked ones stay. [] when none. Cache-Control is no-store.


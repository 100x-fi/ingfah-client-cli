    OutboundBatch:
      properties:
        batch_name:
          example: June renewals
          type: string
        callback_window_mode:
          description: 'Whether the batch calls a customer back at the time the customer
            asked for: exact does, off never calls back. off for a batch created without
            one.'
          enum:
          - "off"
          - exact
          example: "off"
          nullable: true
          type: string
        canceled_at:
          nullable: true
          type: string
        client_batch_id:
          description: The batch's number within the client, and the {id} of every
            /batches/{id} path. Usually equal to id, but not guaranteed to be.
          example: 7
          minimum: 0
          type: integer
        created_at:
          example: "2026-05-28T09:00:00Z"
          type: string
        created_by:
          allOf:
          - $ref: '#/components/schemas/OutboundAdmin'
          nullable: true
          type: object
        est_duration_minutes:
          example: 5
          minimum: 0
          type: integer
        expected_finished_at:
          description: When the remaining records are expected to have been called,
            within the schedule's days and hours.
          example: "2026-06-02T08:00:00Z"
          nullable: true
          type: string
        finished_at:
          nullable: true
          type: string
        id:
          description: Internal id. Not what the paths take — use client_batch_id.
          example: 1042
          minimum: 0
          type: integer
        max_callbacks:
          description: How many callbacks one row may be given. 1 for a batch created
            without one.
          example: 1
          nullable: true
          type: integer
        option_deleted_at:
          description: 'Get batch only: when the batch''s file template was deleted,
            if it has been since the batch was made. Its name and columns are still
            shown.'
          example: "2026-06-03T10:00:00+07:00"
          nullable: true
          type: string
        option_fields:
          description: The file template's columns, as they were when the batch was
            created.
          items:
            $ref: '#/components/schemas/OutboundOptionField'
          type: array
        option_name:
          example: Renewal call list
          nullable: true
          type: string
        progress:
          $ref: '#/components/schemas/OutboundProgress'
        retry_policy:
          description: Absent when the batch was created without one.
          example:
          - 10
          - 30
          items:
            type: integer
          type: array
        schedules:
          items:
            $ref: '#/components/schemas/OutboundSchedule'
          nullable: true
          type: array
        seconds_usage:
          description: Talk time so far.
          example: 2140
          type: integer
        status:
          enum:
          - pending
          - running
          - paused
          - awaiting_callback
          - finished
          - canceled
          example: running
          type: string
        total_calls:
          description: Calls placed so far, retries and callbacks included, answered
            or not.
          example: 16
          type: integer
        total_est_duration_minutes:
          description: Minutes the remaining records are expected to take, from est_duration_minutes
            and how many calls run at once. Absent once nothing is pending or while
            paused.
          example: 100
          nullable: true
          type: integer
        total_receivers:
          description: Records in the batch.
          example: 100
          type: integer
      required:
      - id
      - status
      - client_batch_id
      - batch_name
      - est_duration_minutes
      - created_at
      - total_receivers
      - total_calls
      - seconds_usage
      - progress
      - schedules
      type: object
    OutboundBatchAction:
      properties:
        id:
          description: The batch's client_batch_id.
          example: 7
          minimum: 0
          type: integer
        status:
          description: What was done.
          enum:
          - paused
          - resumed
          - canceled
          - deleted
          example: paused
          type: string
      required:
      - id
      - status
      type: object
    OutboundBatchRecord:
      properties:
        call_attempt_logs:
          description: Every call attempt of the row, oldest first. Attempts made
            before 2026-09-18 are read from the legacy session logs; empty rows pad
            the history up to call_attempts when an early attempt's outcome is unknown.
          items:
            $ref: '#/components/schemas/OutboundBatchRecordCallAttemptLog'
          nullable: true
          type: array
        call_attempts:
          description: Calls placed for the row so far.
          example: 1
          type: integer
        call_pending:
          description: 'The batch will still call the row: it is pending or waiting
            for a callback, or it is missed, busy or error with a retry left. Always
            false once the batch has finished or been canceled.'
          example: false
          type: boolean
        callback_attempts:
          description: 'Callbacks already made for the row, counted apart from call_attempts:
            a callback spends no retry.'
          example: 0
          type: integer
        columns:
          description: Every column of the row, in the template's order.
          items:
            $ref: '#/components/schemas/OutboundRecordColumn'
          nullable: true
          type: array
        customer_name:
          example: Somchai Jaidee
          nullable: true
          type: string
        id:
          example: 501
          minimum: 0
          type: integer
        latest_chat_session:
          allOf:
          - $ref: '#/components/schemas/OutboundRecordSession'
          description: 'The most recent call placed for the row, with its outcome;
            null until one has been. Its id is a chat session: Get chat session has
            the transcript.'
          nullable: true
          type: object
        lease_until:
          description: While a worker holds the row to call it. While call_pending
            on a missed, busy or error row, when its next retry is due.
          nullable: true
          type: string
        optional_data:
          description: The template's optional columns, as a JSON object in a string.
          example: '{"policy_number":"PL-2024-0117"}'
          type: string
        phone_number:
          example: "+66812345678"
          type: string
        required_data:
          description: The template's required columns beyond phone_number and customer_name,
            as a JSON object in a string.
          example: '{}'
          type: string
        row_number:
          description: As given when the batch was created.
          example: 1
          minimum: 0
          type: integer
        sip_number:
          description: The number the last call was placed from.
          example: "+6621234567"
          nullable: true
          type: string
        status:
          description: 'pending: not called yet; dialing: being dialed, not answered
            yet; calling: on the line; called: answered; missed: not answered; busy:
            the line was busy; error: could not be placed; dnc: will not be called;
            callback: to be called back at lease_until.'
          enum:
          - pending
          - dialing
          - calling
          - called
          - missed
          - busy
          - error
          - dnc
          - callback
          example: called
          type: string
      required:
      - id
      - row_number
      - status
      - phone_number
      - required_data
      - optional_data
      - columns
      - call_attempts
      - callback_attempts
      - call_pending
      - call_attempt_logs
      type: object
    OutboundBatchRecordAttemptSession:
      properties:
        disposition_outcome:
          description: What the call came to; null when it has not been set.
          example: สนใจสินค้า
          nullable: true
          type: string
        disposition_outcome_updated_admin_id:
          description: Set when an admin corrected the outcome by hand.
          minimum: 0
          nullable: true
          type: integer
        disposition_outcome_updated_at:
          nullable: true
          type: string
        end_time:
          example: "2026-06-25T05:42:15Z"
          nullable: true
          type: string
        id:
          description: The chat session's UUID.
          example: 8f0c2a4e-1b7d-4a55-9f3e-2c6d1e0b9a71
          type: string
        outcome_metadata:
          description: The structured fields the product's outcome_metadata postprocessor
            extracted; null when there is none.
        start_time:
          example: "2026-06-25T05:27:03Z"
          type: string
        summary:
          example: The customer agreed to renew and will pay by the end of the month.
          nullable: true
          type: string
        title:
          example: 'Outbound: policy renewal'
          nullable: true
          type: string
      required:
      - id
      - start_time
      - outcome_metadata
      type: object
    OutboundBatchRecordCallAttemptLog:
      properties:
        call_attempts:
          description: How many ordinary calls the row had seen when this attempt
            was placed; 1 is the first.
          example: 2
          type: integer
        callback_attempts:
          description: Which callback of the row this was; 0 for an ordinary attempt.
            call_attempts + callback_attempts is the row's counts right after this
            call.
          example: 0
          type: integer
        chat_session:
          allOf:
          - $ref: '#/components/schemas/OutboundBatchRecordAttemptSession'
          description: 'The chat session this attempt reached; null when the call
            was never answered. Its id is a chat session: Get chat session has the
            transcript.'
          nullable: true
          type: object
        created_at:
          description: When the call was placed.
          example: "2026-06-25T05:27:00Z"
          nullable: true
          type: string
        id:
          description: The outbound_call_logs row of the attempt; null when the attempt
            predates that table (2026-09-18) or nothing is known about it.
          example: 88042
          minimum: 0
          nullable: true
          type: integer
        remark:
          description: What kind of attempt this was; callback = the customer asked
            for it. Null for an ordinary attempt.
          example: callback
          nullable: true
          type: string
        sip_number:
          description: The number this attempt was placed from.
          example: "+6621234567"
          nullable: true
          type: string
        status:
          description: How this attempt ended; dialing while it is still being dialed;
            null when nothing is known about it.
          enum:
          - pending
          - dialing
          - calling
          - called
          - missed
          - busy
          - error
          - dnc
          - callback
          example: called
          nullable: true
          type: string
        status_reason:
          example: amd
          nullable: true
          type: string
      required:
      - call_attempts
      - callback_attempts
      type: object
    OutboundBoundTeam:
      properties:
        agents:
          items:
            $ref: '#/components/schemas/OutboundBoundTeamAgent'
          nullable: true
          type: array
        id:
          example: 18

openapi: 3.0.3
info:
  description: |-
    The integration API of [ingfah.ai](https://ingfah.ai), the voice AI agent platform: read your AI agents and teams, run outbound calling campaigns, and pull every call's transcript, outcome and recording into your own systems.

    **Base URL:** `https://api.ingfah.ai`

    ## Authentication

    Every request carries an API key in the `X-Api-Key` header. Keys are created and revoked in the dashboard, each with the scopes it may use.

    ```
    X-Api-Key: sk-ing-v1-…
    ```

    A key carries **scopes**. Each operation below names the scope it needs, for example `chat_sessions:read`; a key with the scope `*` may call everything. Requests fail with

    - **401** `unauthorized` when the key is missing, malformed or unknown, or has passed its expiry date (then with the code `API_KEY_EXPIRED`),
    - **403** `forbidden` when the key lacks the operation's scope, or when the client's license has ended.

    A key acts as the admin who created it: what that admin may not see (a private agent of another admin, for example) the key may not see either.

    ## Responses

    Every JSON response is an envelope with a `status`.

    A single result:
    ```json
    { "status": "success", "data": { … } }
    ```

    A page of results:
    ```json
    { "status": "success", "data": [ … ], "pagination": { "page": 1, "per_page": 20, "total": 137, "total_pages": 7, "has_next": true, "has_prev": false } }
    ```

    An error:
    ```json
    { "status": "error", "error": "bad request", "error_detail": "name is required" }
    ```

    `error` is a short, stable phrase that goes with the HTTP status (`bad request`, `unauthorized`, `forbidden`, `resource not found`…). `error_detail` says what went wrong in the server's own words, for a person reading the response; its wording may change, so do not match on it. Some errors add `errors`, a list of `{ code, detail }` items with a machine-readable `code`. On a 500 every detail is replaced by `internal server error`.

    | Status | Meaning |
    |---|---|
    | 400 | The request is malformed: a required field is missing, a value is out of range, an id is not a number. |
    | 401 | No valid API key, or the key has expired (`API_KEY_EXPIRED`). |
    | 403 | The key lacks the scope, the resource belongs to another client, or the license has ended. |
    | 404 | Nothing with that id, slug or uuid, in your client. |
    | 422 | The request is well formed but the state does not allow it: a team with no phone number, a batch that already ended. |
    | 500 | Something failed on our side; retry later and tell us if it persists. |

    Fields marked *required* in a response are always present (they may still be `null` when marked *nullable*); other fields are present only in the situations their description gives.

    ## Conventions

    - **Timestamps** are RFC 3339 in UTC: `2026-05-25T11:05:00Z`. Query parameters that take a time accept RFC 3339 with any offset.
    - **Phone numbers** are E.164: `+66812345678`. Filters that search by phone also accept the national form (`0812345678`).
    - **Pagination** is `page` (from 1) and `per_page`; each list gives its maximum. Agent test sessions also offer cursor pagination for walking a long history without skipping rows.
    - **Ids**: agents are addressed by their `slug` (given by the server when the agent is created), chat sessions by `uuid`, everything else by a numeric `id`.

    ## Code tools

    A plugin function can be code you write, in JavaScript or Python, instead of a request the platform builds for you. A code tool is a plugin function with the integration `wasm` and the method `run`, and two integration parameters: `language`, which is `javascript` or `python`, and `code`, the source. The agent calls it like any other tool: the code gets the arguments, does its work (calls your systems through `http`, for example) and returns the object the agent reads.

    ```json
    {
      "signature": "check_customer",
      "description": "Look the customer up in the CRM",
      "integration": "wasm",
      "method": "run",
      "parameters": [ { "name": "customer_id", "type": "string", "description": "The customer's id", "required": true } ],
      "integration_parameters": [
        { "key": "language", "value": "javascript" },
        { "key": "code", "value": "export default async function run({ args, secrets, http }) { … }" }
      ]
    }
    ```

    The code is checked when the tool is saved, on create and on update: code that does not parse, or imports a package, is refused with a **400** and nothing is saved, so a saved tool always builds. That 400 carries `errors` with the code `WASM_BUILD_FAILED`, and `data` with the failure (`line` is `null` when it is not known):

    ```json
    { "status": "error", "error": "invalid request", "error_detail": "build failed: unexpected token in expression: '}' (line 7)", "errors": [ { "code": "WASM_BUILD_FAILED", "detail": "build failed: unexpected token in expression: '}' (line 7)" } ], "data": { "stage": "build", "message": "unexpected token in expression: '}'", "line": 7 } }
    ```

    ### The function

    | | JavaScript | Python |
    |---|---|---|
    | Shape | `export default async function run({ args, secrets, http }) { …; return { … }; }` (`async` is optional; a returned promise is awaited) | `def run(args, secrets, http): …; return { … }` (`def`, not `async def`) |
    | `args` | an object: the tool's parameters by name, typed as declared | a `dict` |
    | `secrets` | see Secrets below | see Secrets below |
    | Return | a plain object: the tool result the agent reads | a `dict` |
    | Errors | `throw new Error("…")`: the run fails with the message | `raise Exception("…")`: the same |

    The object is returned as it is: a key of its own named `result` is not unwrapped. Anything that is not an object (a string, an array, `null`, no `return`) fails the run with `the function must return a JSON object`.

    ### Secrets

    `secrets` holds every secret of your client (see Client secrets), by name, loaded again for every call.

    - JavaScript: `secrets.CRM_API_KEY` is the value, or `undefined` when there is no such secret.
    - Python: `secrets['CRM_API_KEY']` is the value, and raises `KeyError` when there is no such secret; `secrets.get('CRM_API_KEY')` gives `None` instead.

    No secret's value is shown in an error or a test result: each one is replaced by `[REDACTED]`.

    ### The http helper

    `http` is the code's only way out. It is synchronous: each call waits for the response and returns it (in JavaScript, `await http.get(…)` works too). The run's 10 s cover every request it makes.

    | Member | Meaning |
    |---|---|
    | `http.get(url, opts)`, `http.post`, `http.put`, `http.patch`, `http.delete` | One request each. In Python the options are keyword arguments: `http.get(url, query=…, headers=…, body=…)`. |
    | `query` | An object of names and values, added to the URL, encoded. |
    | `headers` | An object of header names and values. |
    | `body` | A string is sent as it is (`Content-Type: text/plain; charset=utf-8` unless you set one); anything else is sent as JSON (`application/json` unless you set one). |
    | `res.status` | The status, a number. |
    | `res.ok` | True for a 2xx status. |
    | `res.headers` | The response headers, by lowercase name. |
    | `res.text()` | The body, as a string. |
    | `res.json()` | The body, parsed. It throws (JavaScript) or raises `ValueError` (Python) when the body is not JSON. |

    A response of any status is returned, not thrown: read `res.status` and decide. Redirects are not followed: a 301 or 302 comes back as it is, with its `location` header. Nothing is retried. A request that gets no response (DNS, connection, TLS, timeout) throws an `Error` (JavaScript) or raises `ConnectionError` (Python), which the code may catch. A request to a private, loopback or link-local address is never sent and ends the run; so does a response over 1 MiB.

    ### What you cannot do

    - **Import packages.** JavaScript imports nothing: no `import`, no `require`. Python imports the standard library only (`json`, `re`, `datetime`, `decimal`, `math`, `base64`, `hashlib`, `uuid`, `urllib.parse`, `collections`, `itertools`, …), and not these modules of it, which cannot work here: `os`, `subprocess`, `socket`, `threading`, `multiprocessing`, `ctypes`, `signal`, `asyncio`, `selectors`, `ssl`, `http`, `urllib.request`, `ftplib`, `smtplib`, `webbrowser`, `pty`, `tty`, `termios`, `resource`, `mmap`, `importlib` (`import socket is not available in this runtime; use the http helper for network calls`). An import is refused when the tool is saved.
    - **Reach the network other than through `http`.** JavaScript has no `fetch` and no `XMLHttpRequest`.
    - **Sleep.** JavaScript has no `setTimeout`; in Python `time.sleep` raises `OSError`.
    - **Use files or start processes.** The clock works: `Date.now()`, `datetime.now()`.
    - **Keep anything between calls.** Every call starts afresh.

    ### Limits

    | Limit | Value |
    |---|---|
    | Code | 1 MiB |
    | Time | 10 s a run, every `http` request included (`timed out after 10 s`); 3 s for the check on save (`build timed out after 3 s`) |
    | Memory | JavaScript 32 MiB, Python 64 MiB |
    | Result | 1 MiB (`the result is larger than 1 MiB`) |
    | An `http` request, its response | 1 MiB each |
    | Tests | 10 tests per admin per minute, test-code and test-run together; the 11th is a `429` |

    ### Examples

    Both examples call `https://httpbin.org/anything`, a public service that answers with the request it received, so they run as they are: test them with `"parameters": { "customer_id": "C-1029" }` and a secret named `CRM_API_KEY` in Client secrets. In your own tool, put your system's URL in its place and read the fields it answers with.

    JavaScript, looking a customer up:

    ```js
    export default async function run({ args, secrets, http }) {
      const res = http.get("https://httpbin.org/anything/customers", {
        query: { id: args.customer_id },
        headers: { Authorization: `Bearer ${secrets.CRM_API_KEY}` },
      });
      if (!res.ok) throw new Error(`CRM answered ${res.status}`);
      const echoed = res.json(); // httpbin.org answers with the request: the query is in args
      return { customer_id: echoed.args.id, checked_at: new Date().toISOString() };
    }
    ```

    Python, opening a ticket:

    ```python
    from datetime import datetime, timezone

    def run(args, secrets, http):
        res = http.post("https://httpbin.org/anything/tickets",
                        headers={"Authorization": f"Bearer {secrets['CRM_API_KEY']}"},
                        body={"customer_id": args["customer_id"], "subject": "Call back"})
        if not res.ok:
            raise Exception(f"CRM answered {res.status}")
        echoed = res.json()  # httpbin.org answers with the request: the JSON body is in json
        return {"customer_id": echoed["json"]["customer_id"], "opened_at": datetime.now(timezone.utc).isoformat()}
    ```

    ### Errors you will see

    A test of code that fails answers with `data.status` `error`, the `stage` it failed at and the `error`, and `line` when it is known. Saving code that fails at `build` is the 400 above.

    | The code | `stage` | `error` |
    |---|---|---|
    | `import requests` (Python) | `build` | `import requests is not allowed: only the Python standard library can be imported`, with the line of the import |
    | `import _ from "lodash"` (JavaScript) | `build` | `import of "lodash" is not allowed: packages cannot be imported, only the language's built-ins and the http helper`, with the line of the import |
    | an extra `}` on line 7 (JavaScript) | `build` | `unexpected token in expression: '}'` on line 7 |
    | Python code while `language` is `javascript` | `build` | `the code must export a default function: export default async function run({ args, secrets, http })` |
    | `while (true) {}` | `run` | `timed out after 10 s` |
    | `http.get("http://10.0.0.5/")` | `run` | `http_request: Get "http://10.0.0.5/": dial tcp 10.0.0.5:80: refusing to connect to private, loopback, or link-local address 10.0.0.5` |
    | code that keeps taking memory (JavaScript) | `run` | `the code ran out of memory (32 MiB)` |
    | code that keeps taking memory (Python) | `run` | `the code ran out of memory (64 MiB)` |
    | `return "ok"` | `run` | `the function must return a JSON object` |
    | `throw new Error(secrets.CRM_API_KEY)` | `run` | `Error: [REDACTED]` |
    | `time.sleep(1)` (Python) | `run` | `OSError: time.sleep is not available in this runtime` |

    ### Test before saving

    `POST /client/plugin-functions/test-code` builds and runs the code in the body, saved or not, with the parameter values you give, as the agent's call would run it: in the same sandbox, with every secret of your client. Nothing is saved, and no agent sees the test. It is not a dry run: a request the code makes reaches the real system. It needs `ai_agents:write`.

    ```json
    { "language": "javascript", "code": "export default async function run({ args, secrets, http }) { … }", "parameters": { "customer_id": "C-1029" } }
    ```

    A run that finished is a **200**, whether the code worked or not:

    ```json
    { "status": "success", "data": { "status": "success", "stage": null, "result": { "customer_id": "C-1029" }, "error": null, "line": null } }
    { "status": "success", "data": { "status": "error", "stage": "build", "result": null, "error": "unexpected token in expression: '}'", "line": 7 } }
    ```

    The test is refused with a **400** when `language` is not `javascript` or `python` (`language must be javascript or python`), when `code` is empty (`code is required`) or over 1 MiB (`code must be at most 1 MiB`), or when `parameters` is not an object. Each admin has 10 tests per minute, test-code and test-run together, and an API key's tests count against the admin it belongs to: the 11th is a `429` `too many requests` (`too many test runs, try again in a minute`).

    ## Speech API

    Text-to-speech lives on a separate host, `speech-api.ingfah.ai`, with its own key: see the Speech API sections at the end. It is documented here for completeness; it is not covered by the tests the rest of this document is generated from.

            PRONUNCIATION_EMPTY, WORD_TOO_LONG, PRONUNCIATION_TOO_LONG, DUPLICATE_IN_REQUEST,
            WORD_EXISTS (the set already has it as typed; us beside the set''s US
            is a new word). WORD_TOO_LONG also covers a word too long for the set''s
            index (some 900+ character words of scripts that do not compress).'
          enum:
          - WORD_EMPTY
          - PRONUNCIATION_EMPTY
          - WORD_TOO_LONG
          - PRONUNCIATION_TOO_LONG
          - DUPLICATE_IN_REQUEST
          - WORD_EXISTS
          type: string
        duplicate_of_index:
          description: 'Only with DUPLICATE_IN_REQUEST: the earlier item with the
            same word, as typed (US and us are two words).'
          nullable: true
          type: integer
        index:

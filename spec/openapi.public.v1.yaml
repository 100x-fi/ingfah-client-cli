          type: string
      responses:
        "200":
          content:
            audio/ogg:
              schema:
                type: string
          description: OK
        "401":
          content:
            application/json:
              example:
                error: unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                error: resource not found
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Not Found
      security:
      - apiKey: []
      summary: Download call recording
      tags:
      - Chat sessions

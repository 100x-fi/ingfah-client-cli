          type: number
        voice_volume:
          description: Loudness multiplier; 1 is the voice's normal volume. A call
            clamps it to the range the voice allows, 0.5 to 2.0 in steps of 0.1 when
            the voice sets none; absent speaks at 1.
          example: 1
          nullable: true
          type: number

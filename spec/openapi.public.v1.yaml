  /client/ai-agents/browse:
    get:
      description: |-
        One operation for the card view and the folder view; folder_id is always the scope, and nothing is paged: both lists come whole in one response (page and per_page are ignored). Level mode (no search): the folders directly in folder_id (0 = top level), every one of them with its agent count, and the agents directly in it. Search mode (search sent): the folders below folder_id whose name contains search, and the agents anywhere below folder_id that match search, each with its folder path. The filters visibility, publish_status, team_id (0 = in no team) and created_admin_id apply in both modes; every one is comma-separated with its values OR-ed, and the filters are AND-ed with each other and with search: they narrow the agents listed and every folder's agent_count, and never drop a folder. Visibility is unchanged: an owner sees every agent, an operator its own and every public one, by the admin's role in the database (an API key as the role of its creator); every admin sees every folder. Checks, the first failure wins: type (400), folder_id, visibility, publish_status (and the old status CSV, now a 400), team_id, created_admin_id, sort_by and sort_dir (400), the folder not found or another client's (404 AI_AGENT_FOLDER_NOT_FOUND, both modes), any listed team not found, deleted or another client's (404 PRODUCT_NOT_FOUND; team_id 0 is never looked up), any listed admin not found or another client's (404 CLIENT_ADMIN_NOT_FOUND); one bad id fails the whole request. An API key whose creator admin is gone is a 401.

        API key scope: `ai_agents:read`.
      operationId: browseAgents
      parameters:
      - description: 'Required: the tab.'
        in: query
        name: type
        schema:
          description: 'Required: the tab.'
          enum:
          - audio
          - text
          example: audio
          nullable: true
          type: string
      - description: 'The scope: the level to open, and with a search the subtree
          searched; 0 or left out is the top level, whose subtree is the whole tab.
          A non-negative integer that fits bigint (007 is 7); it must be a folder
          of the caller''s client, any tab, in both modes (else 404 AI_AGENT_FOLDER_NOT_FOUND).
          A folder of the other tab is no error: both lists are empty.'
        in: query
        name: folder_id
        schema:
          description: 'The scope: the level to open, and with a search the subtree
            searched; 0 or left out is the top level, whose subtree is the whole tab.
            A non-negative integer that fits bigint (007 is 7); it must be a folder
            of the caller''s client, any tab, in both modes (else 404 AI_AGENT_FOLDER_NOT_FOUND).
            A folder of the other tab is no error: both lists are empty.'
          example: "7"
          nullable: true
          pattern: ^[0-9]+$
          type: string
      - description: 'Trimmed; when not empty, search mode: the folders below folder_id
          whose name contains it (the scope folder itself excluded) and the agents
          anywhere below folder_id whose name, description or revision name contains
          it, case-insensitive. All whitespace is not sent.'
        in: query
        name: search
        schema:
          description: 'Trimmed; when not empty, search mode: the folders below folder_id
            whose name contains it (the scope folder itself excluded) and the agents
            anywhere below folder_id whose name, description or revision name contains
            it, case-insensitive. All whitespace is not sent.'
          example: ผ่อน
          nullable: true
          type: string
      - description: 'A filter, in both modes; also narrows each folder''s agent_count.
          Comma-separated, each value at most once, OR-ed (public,private is no filter):
          the visibility field of the agent. AND-ed with publish_status. The one status
          CSV the two replaced is a 400.'
        in: query
        name: visibility
        schema:
          description: 'A filter, in both modes; also narrows each folder''s agent_count.
            Comma-separated, each value at most once, OR-ed (public,private is no
            filter): the visibility field of the agent. AND-ed with publish_status.
            The one status CSV the two replaced is a 400.'
          example: public
          nullable: true
          pattern: ^(public|private)(,(public|private))?$
          type: string
      - description: 'A filter, in both modes; also narrows each folder''s agent_count.
          Comma-separated, each value at most once, OR-ed: published is has_published
          (a revision with published_at set), draft is has_draft (the newest revision
          is an unpublished, undeleted draft); published,draft is agents that are
          published or have a draft. AND-ed with visibility: visibility=public&publish_status=published
          is public agents that are published.'
        in: query
        name: publish_status
        schema:
          description: 'A filter, in both modes; also narrows each folder''s agent_count.
            Comma-separated, each value at most once, OR-ed: published is has_published
            (a revision with published_at set), draft is has_draft (the newest revision
            is an unpublished, undeleted draft); published,draft is agents that are
            published or have a draft. AND-ed with visibility: visibility=public&publish_status=published
            is public agents that are published.'
          example: published
          nullable: true
          pattern: ^(published|draft)(,(published|draft))?$
          type: string
      - description: 'A filter, in both modes; also narrows each folder''s agent_count.
          Comma-separated AI team ids (client_products.id) of the caller''s client,
          each at most once, OR-ed. 1 and up: the agents of that team, whatever its
          status: its starting agent and every agent in its transfer graph. 0: the
          agents in no team, i.e. not the starting agent and not in the transfer graph
          of any undeleted team of the client, any status, either tab; never looked
          up. 0,12 is the agents in no team or in team 12; an agent in two listed
          teams is listed once. A team of the other tab is no error: it adds nothing.
          Any id not found, deleted or another client''s fails the whole request:
          404 PRODUCT_NOT_FOUND.'
        in: query
        name: team_id
        schema:
          description: 'A filter, in both modes; also narrows each folder''s agent_count.
            Comma-separated AI team ids (client_products.id) of the caller''s client,
            each at most once, OR-ed. 1 and up: the agents of that team, whatever
            its status: its starting agent and every agent in its transfer graph.
            0: the agents in no team, i.e. not the starting agent and not in the transfer
            graph of any undeleted team of the client, any status, either tab; never
            looked up. 0,12 is the agents in no team or in team 12; an agent in two
            listed teams is listed once. A team of the other tab is no error: it adds
            nothing. Any id not found, deleted or another client''s fails the whole
            request: 404 PRODUCT_NOT_FOUND.'
          example: 12,0
          nullable: true
          pattern: ^[0-9]+(,[0-9]+)*$
          type: string
      - description: 'A filter, in both modes; also narrows each folder''s agent_count.
          Comma-separated client admin ids of the caller''s client, each at most once,
          OR-ed: the agents created by any of them, any admin status. Any id not found
          (client admins are hard-deleted) or another client''s fails the whole request:
          404 CLIENT_ADMIN_NOT_FOUND.'
        in: query
        name: created_admin_id
        schema:
          description: 'A filter, in both modes; also narrows each folder''s agent_count.
            Comma-separated client admin ids of the caller''s client, each at most
            once, OR-ed: the agents created by any of them, any admin status. Any
            id not found (client admins are hard-deleted) or another client''s fails
            the whole request: 404 CLIENT_ADMIN_NOT_FOUND.'
          example: 5,6
          nullable: true
          pattern: ^[1-9][0-9]*(,[1-9][0-9]*)*$
          type: string
      - description: 'Orders folders and agents alike. created_at (default): when
          created. name: as GET /client/ai-agents (names starting with a Thai character
          first, then every other name, each group in Thai dictionary order); folders
          by their name the same way. last_edited: agents as GET /client/ai-agents,
          folders by updated_at (the last rename or move). Ties are always broken
          by id ascending.'
        in: query
        name: sort_by
        schema:
          description: 'Orders folders and agents alike. created_at (default): when
            created. name: as GET /client/ai-agents (names starting with a Thai character
            first, then every other name, each group in Thai dictionary order); folders
            by their name the same way. last_edited: agents as GET /client/ai-agents,
            folders by updated_at (the last rename or move). Ties are always broken
            by id ascending.'
          enum:
          - created_at
          - name
          - last_edited
          example: name
          nullable: true
          type: string
      - description: Defaults to desc for created_at and last_edited, asc for name.
          For name, desc reverses inside each group only.
        in: query
        name: sort_dir
        schema:
          description: Defaults to desc for created_at and last_edited, asc for name.
            For name, desc reverses inside each group only.
          enum:
          - asc
          - desc
          example: asc
          nullable: true
          type: string
      responses:

openapi: 3.0.3
info:
  description: |-
    The integration API of [ingfah.ai](https://ingfah.ai), the voice AI agent platform: read your AI agents and teams, run outbound calling campaigns, and pull every call's transcript, outcome and recording into your own systems.

    **Base URL:** `https://api.ingfah.ai`

    ## Authentication

    Every request carries an API key in the `X-Api-Key` header. Keys are created and revoked in the dashboard, each with the scopes it may use.

    ```
    X-Api-Key: sk-ing-v1-…
    ```

    A key carries **scopes**. Each operation below names the scope it needs, for example `chat_sessions:read`; a key with the scope `*` may call everything. Requests fail with

    - **401** `unauthorized` when the key is missing, malformed or unknown,
    - **403** `forbidden` when the key lacks the operation's scope, or when the client's license has ended.

    A key acts as the admin who created it: what that admin may not see (a private agent of another admin, for example) the key may not see either.

    ## Responses

    Every JSON response is an envelope with a `status`.

    A single result:
    ```json
    { "status": "success", "data": { … } }
    ```

    A page of results:
    ```json
    { "status": "success", "data": [ … ], "pagination": { "page": 1, "per_page": 20, "total": 137, "total_pages": 7, "has_next": true, "has_prev": false } }
    ```

    An error:
    ```json
    { "status": "error", "error": "bad request", "error_detail": "name is required" }
    ```

    `error` is a short, stable phrase that goes with the HTTP status (`bad request`, `unauthorized`, `forbidden`, `resource not found`…). `error_detail` says what went wrong in the server's own words, for a person reading the response; its wording may change, so do not match on it. Some errors add `errors`, a list of `{ code, detail }` items with a machine-readable `code`. On a 500 every detail is replaced by `internal server error`.

    | Status | Meaning |
    |---|---|
    | 400 | The request is malformed: a required field is missing, a value is out of range, an id is not a number. |
    | 401 | No valid API key. |
    | 403 | The key lacks the scope, the resource belongs to another client, or the license has ended. |
    | 404 | Nothing with that id, slug or uuid, in your client. |
    | 422 | The request is well formed but the state does not allow it: a team with no phone number, a batch that already ended. |
    | 500 | Something failed on our side; retry later and tell us if it persists. |

    Fields marked *required* in a response are always present (they may still be `null` when marked *nullable*); other fields are present only in the situations their description gives.

    ## Conventions

    - **Timestamps** are RFC 3339 in UTC: `2026-05-25T11:05:00Z`. Query parameters that take a time accept RFC 3339 with any offset.
    - **Phone numbers** are E.164: `+66812345678`. Filters that search by phone also accept the national form (`0812345678`).
    - **Pagination** is `page` (from 1) and `per_page`; each list gives its maximum. Agent test sessions also offer cursor pagination for walking a long history without skipping rows.
    - **Ids**: agents are addressed by their `slug` (given by the server when the agent is created), chat sessions by `uuid`, everything else by a numeric `id`.

    ## Speech API

    Text-to-speech lives on a separate host, `speech-api.ingfah.ai`, with its own key: see the Speech API sections at the end. It is documented here for completeness; it is not covered by the tests the rest of this document is generated from.
  title: ingfah API
  version: 1.0.0
servers:
- url: https://api.ingfah.ai
tags:
- description: An AI agent is a persona with a voice and instructions. Its instructions
    are versioned in revisions; the published revision is the one that takes calls.
    Templates are ready-made agents to copy from. Create, delete and the updates need
    `ai_agents:write`, reading needs `ai_agents:read`.
  name: Agents
- description: 'A revision is one version of an agent''s instructions: create a draft,
    then publish it to put it live. Reading needs `ai_agents:read`; create, publish
    and delete need `ai_agents:write`.'
  name: Agent revisions
- description: A plugin function is a tool an agent can call during a conversation
    — an HTTP request to your systems, for example — with the arguments it fills in
    from what the customer says. Create, update, delete, duplicate and test-run need
    `ai_agents:write`; reading needs `ai_agents:read`.
  name: Plugin functions
- description: The things an agent can do on the phone line itself — transfer to a
    human, send DTMF, hang up. An agent's revision names the ones it may use. Needs
    `ai_agents:read`.
  name: Phone tools
- description: The things a text agent can do in a chat itself — hand off to a human,
    send an image. An agent's revision names the ones it may use. Needs `ai_agents:read`.
  name: Text chat tools
- description: The voices an agent can speak with — the platform's global ones plus
    your own. A voice's `id` is the `voice_id` an agent or a revision is created with.
    Needs `ai_agents:read`.
  name: Agent options
- description: 'An AI team is a starting agent plus the agents it may transfer a call
    to, on one channel: audio or text, inbound or outbound. The API calls it a *product*:
    its numeric `id` is the `client_product_id` other operations ask for. Reading
    needs `client_products:read`; create, update and delete need `client_products:write`.'
  name: AI teams
- description: 'A postprocessor is a step that runs on each of a team''s conversations
    once it ends: the *disposition* (what the conversation came to, from outcomes
    you define) or *outcome metadata* (fields of a JSON schema the model fills in).
    Needs `client_products:write`.'
  name: AI team postprocessors
- description: 'An automation is something that happens when an event of one of a
    team''s conversations fires — it starts, it ends, or a text chat is handed to
    a human: `http` sends a request to your systems, `do_not_contact` puts the customer''s
    number on the do-not-contact list. Its condition and config are jinja templates
    over the conversation''s fields, which the catalog lists per team. Listing and
    the catalog need `client_products:read`; create, update and delete need `client_products:write`.'
  name: AI team automations
- description: 'A file template is the column layout a campaign''s records follow:
    which columns a record has, and which of them are required. The API calls it an
    *outbound option*. Create, update and delete need `client_outbound_options:write`;
    reading needs `client_outbound_options:read`.'
  name: Outbound file templates
- description: 'A batch is an outbound calling campaign: a list of records (people
    to call) with a dialing schedule. Create, pause, resume and cancel need `client_outbound_batches:write`;
    reading needs `client_outbound_batches:read`.'
  name: Outbound batches
- description: 'A chat session is one call (or one text conversation): its transcript,
    tool calls, summary, outcome and recording. Needs `chat_sessions:read`.'
  name: Chat sessions
- description: 'A test session is a conversation an admin had with an agent from the
    editor, to try it out: kept apart from real sessions, with the version of the
    agent it ran against. Needs `chat_sessions:read`.'
  name: Agent test sessions
- description: A text chat conversation is one customer on one text channel, answered
    by an AI team. Turning the AI on or off for a conversation needs `text_chat_conversations:write`.
  name: Text chats
- description: 'A CRM user is one person you call, keyed by phone number, with whether
    they may be contacted: an outbound batch skips a number on the do-not-contact
    list. Listing needs `crm_client_users:read`; creating or updating one needs `crm_client_users:write`.'
  name: CRM
- description: Before you transfer a call to us over SIP, ask whether we can take
    it now; if not, send it to a person instead. Needs `inbound_admission:read`.
  name: Inbound calls
- description: |
    Single request/response text-to-speech synthesis. Returns raw PCM audio.

    **Base URL:** `https://speech-api.ingfah.ai`

    **Authentication:** Bearer token in the `Authorization` header (not `X-Api-Key`).
    ```
    Authorization: Bearer <your-tts-api-key>
    ```
    > **Note:** `<your-tts-api-key>` is a **Speech API key**, separate from the `X-Api-Key` used by the other ingfah endpoints. TTS API keys are not self-service: contact the ingfah team to get one issued.

    Not covered by the tests the rest of this document is generated from.
  name: Speech API (REST)
- description: |
    Streaming text-to-speech synthesis.

    **Base URL:** `wss://speech-api.ingfah.ai`

    **Authentication:** Bearer token in the `Authorization` header (not `X-Api-Key`).
    ```
    Authorization: Bearer <your-tts-api-key>
    ```
    > **Note:** `<your-tts-api-key>` is a **Speech API key**, separate from the `X-Api-Key` used by the other ingfah endpoints. TTS API keys are not self-service: contact the ingfah team to get one issued.

    ---

    **Synthesize:** `wss://speech-api.ingfah.ai/v1/synthesize/ws`

    Streams raw PCM audio chunks in real time.

    **Query parameters**

    | Parameter | Type | Required | Description |
    |-----------|------|----------|-------------|
    | `voice` | string | Yes | Speech profile name |
    | `language` | string | Yes | BCP-47 language tag (e.g. `th`) |
    | `sampleRate` | integer | Yes | Audio sample rate in Hz (e.g. `16000`, `24000`) |

    **Connection flow**
    1. Client initiates WebSocket upgrade with required query parameters
    2. Server validates parameters
    3. On success, server sends connect message:
    ```json
    { "data": { "base64_encoding": false, "sample_rate": 16000 }, "type": "connect" }
    ```
    4. Connection stays open for bi-directional messaging

    **Client → Server messages**

    `stream` send text to synthesize:
    ```json
    { "type": "stream", "text": "ข้อความที่ต้องการแปลงเป็นเสียง" }
    ```

    `flush` cancel current context and flush audio buffer:
    ```json
    { "type": "flush" }
    ```

    `stop` end the session:
    ```json
    { "type": "stop" }
    ```

    **Server → Client messages**

    Raw binary PCM frames streamed as binary WebSocket frames.

    **Error codes**

    | Code | Description |
    |------|-------------|
    | `required.voice` | Missing `voice` query parameter |
    | `required.language` | Missing `language` query parameter |
    | `required.sampleRate` | Missing `sampleRate` query parameter |
    | `invalid.language` | Unsupported language |
    | `invalid.sampleRate` | `sampleRate` is not a valid number |
    | `bad_request.invalid_message_type` | Non-text WebSocket frame sent |
    | `bad_request.invalid_payload` | Malformed JSON message |
    | `internal_server_error` | Server error |

    **Session end**

    Session ends when client sends `stop`, sends malformed JSON, sends a non-text frame, or server encounters an error. Server closes the WebSocket connection.
  name: Speech API (WebSocket)
paths:
  /client/agent-templates:
    get:
      description: |-
        Ready-made agents to start from: the platform's global templates plus the client's own, newest first. A template's fields are meant to be copied into Create agent.

        API key scope: `ai_agents:read`.
      operationId: listAgentTemplates
      parameters:
      - description: Only templates of this channel type.
        in: query
        name: type
        schema:
          description: Only templates of this channel type.
          enum:
          - audio
          - text
          nullable: true
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - ai_greeting_message: hello
                  ai_instruction_default_variables: {}
                  ai_instruction_flow:
                  - id: greeting
                    transitions: []
                  ai_instruction_identity: You are a template
                  ai_instruction_task: Help the customer
                  ai_instruction_variables:
                    shop: X
                  ai_instructions: ""
                  description: Template Global Text Template
                  name: Global Text Template
                  profile_url: null
                  slug: ingfah-agent-global-text-template
                  type: text
                  vocal_name: Mali
                status: success
              schema:
                $ref: '#/components/schemas/TemplateData'
          description: OK
        "400":
          content:
            application/json:
              example:
                error: invalid request
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Bad Request
        "401":
          content:
            application/json:
              example:
                error: unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Unauthorized
      security:
      - apiKey: []
      summary: List agent templates
      tags:
      - Agents
  /client/agents:
    post:
      description: |-
        Creates the agent together with its first revision, as a draft. The prompt you send is in `ai_agent_instruction_revision` of the response; the agent's own top-level prompt fields stay empty until a revision is published (the dashboard does that), and only a published agent can join a team.

        API key scope: `ai_agents:write`.
      operationId: createAgent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentsCreateBody'
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  ai_agent_instruction_revision:
                    ai_greeting_message: hello
                    ai_instruction_flow:
                    - description: Greeting
                      examples:
                      - Hello
                      guidelines:
                        end_call_keyword: false
                      id: greeting
                      instructions:
                      - say hi
                      position:
                        x: 1
                        "y": 2
                      transitions:
                      - condition: always
                        next_step: end
                    - guidelines:
                        end_call_keyword: false
                      id: greeting-2
                      transitions: []
                    ai_instruction_identity: You are Mali
                    ai_instruction_task: Sell
                    ai_instruction_variables:
                      shop: X
                    ai_instructions: ""
                    ai_workflow: null
                    created_admin_id: 42
                    created_at: "2026-05-25T11:05:00Z"
                    id: 17
                    name: Create Success
                    phone_tools: []
                    text_chat_tools: []
                    vocal_name: Mali
                    voice: null
                    voice_speed: null
                  ai_greeting_message: ""
                  ai_instruction_default_variables: {}
                  ai_instruction_flow: null
                  ai_instruction_identity: null
                  ai_instruction_task: null
                  ai_instruction_variables:
                    shop: X
                  ai_instructions: ""
                  ai_workflow: null
                  can_escalate: true
                  client_id: 106
                  created_admin:
                    avatar_url: null
                    email: somchai@example.com
                    id: 108
                    name: Somchai Jaidee
                    role: owner
                  created_admin_id: 108
                  created_at: "2026-09-10T17:09:00Z"
                  description: Sells things
                  id: 110
                  immediate_response: null
                  is_template: false
                  name: ""
                  profile_url: null
                  published_admin_id: null
                  published_at: null
                  slug: ingfah-agent-example
                  teams: []
                  type: audio
                  updated_at: "2026-09-12T09:11:00Z"
                  visibility: public
                  vocal_name: ""
                  voice: null
                  voice_speed: null
                status: success
              schema:
                $ref: '#/components/schemas/CreateResponseData'
          description: OK
        "400":
          content:
            application/json:
              example:
                error: bad request
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Bad Request
        "401":
          content:
            application/json:
              example:
                error: unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Forbidden
      security:
      - apiKey: []
      summary: Create agent
      tags:
      - Agents
  /client/agents/{agentSlug}/description:
    put:
      description: |-
        Changes the note on what the agent is for. Takes effect immediately, without a revision.

        API key scope: `ai_agents:write`.
      operationId: updateAgentDescription
      parameters:
      - description: The agent's slug.
        in: path
        name: agentSlug
        required: true
        schema:
          description: The agent's slug.
          example: ingfah-agent-mali
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentsUpdateDescriptionBody'
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  description: Sells shoes
                  name: ""
                  slug: ingfah-agent-example
                  updated_at: "2026-05-25T11:05:00Z"
                status: success
              schema:
                $ref: '#/components/schemas/UpdateDescriptionResponseData'
          description: OK
        "400":
          content:
            application/json:
              example:
                error: bad request
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Bad Request
        "401":
          content:
            application/json:
              example:
                error: unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                error: resource not found
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Not Found
      security:
      - apiKey: []
      summary: Update agent description
      tags:
      - Agents
  /client/agents/{agentSlug}/profile:
    put:
      description: |-
        Sets the agent's picture. Takes effect immediately, without a revision.

        API key scope: `ai_agents:write`.
      operationId: updateAgentProfile
      parameters:
      - description: The agent's slug.
        in: path
        name: agentSlug
        required: true
        schema:
          description: The agent's slug.
          example: ingfah-agent-mali
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentsUpdateProfileBody'
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  name: ""
                  profile_url: https://example.com/mali.png
                  slug: ingfah-agent-example
                  updated_at: "2026-05-25T11:05:00Z"
                status: success
              schema:
                $ref: '#/components/schemas/UpdateProfileResponseData'
          description: OK
        "400":
          content:
            application/json:
              example:
                error: bad request
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Bad Request
        "401":
          content:
            application/json:
              example:
                error: unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                error: resource not found
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Not Found
      security:
      - apiKey: []
      summary: Update agent profile image URL
      tags:
      - Agents
  /client/agents/{agentSlug}/visibility:
    put:
      description: |-
        Makes the agent visible to every admin of the client (public) or to its creator alone (private). Only the admin who created the agent may change it — not even an owner-role admin otherwise (403); an API key counts as the admin it belongs to.

        API key scope: `ai_agents:write`.
      operationId: updateAgentVisibility
      parameters:
      - description: The agent's slug.
        in: path
        name: agentSlug
        required: true
        schema:
          description: The agent's slug.
          example: ingfah-agent-mali
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentsUpdateVisibilityBody'
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  slug: ingfah-agent-example
                  visibility: private
                status: success
              schema:
                $ref: '#/components/schemas/UpdateVisibilityResponseData'
          description: OK
        "400":
          content:
            application/json:
              example:
                error: bad request
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Bad Request
        "401":
          content:
            application/json:
              example:
                error: unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                error: forbidden
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                error: resource not found
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Not Found
      security:
      - apiKey: []
      summary: Update agent visibility
      tags:
      - Agents
  /client/agents/{slug}:
    delete:
      description: |-
        Deletes the agent and its revisions. Refused with 400 for a template agent, and while the agent is on an active AI team (as starting agent or transfer target) or has a chat session still open: take it off the team first.

        API key scope: `ai_agents:write`.
      operationId: deleteAgent
      parameters:
      - description: The agent's slug.
        in: path
        name: slug
        required: true
        schema:
          description: The agent's slug.
          example: ingfah-agent-mali
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  id: 8
                  slug: ingfah-agent-example
                  status: deleted
                status: success
              schema:
                $ref: '#/components/schemas/DeleteResponseData'
          description: OK
        "400":
          content:
            application/json:
              example:
                error: bad request
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Bad Request
        "401":
          content:
            application/json:
              example:
                error: unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                error: resource not found
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Not Found
      security:
      - apiKey: []
      summary: Delete agent
      tags:
      - Agents
    get:
      description: |-
        One agent in full. The top-level prompt fields are the published revision's (empty or null until one is published); `ai_agent_instruction_revision` is the current draft, absent when there is none. `teams` lists the AI teams the agent is on.

        API key scope: `ai_agents:read`.
      operationId: getAgent
      parameters:
      - description: The agent's slug.
        in: path
        name: slug
        required: true
        schema:
          description: The agent's slug.
          example: ingfah-agent-mali
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  ai_greeting_message: hello
                  ai_instruction_default_variables: {}
                  ai_instruction_flow:
                  - description: Greeting
                    examples:
                    - Hello
                    guidelines:
                      end_call_keyword: false
                    id: greeting
                    instructions:
                    - say hi
                    position:
                      x: 1
                      "y": 2
                    transitions:
                    - condition: always
                      next_step: end
                  - guidelines:
                      end_call_keyword: false
                    id: greeting-2
                    transitions: []
                  ai_instruction_identity: You are Mali
                  ai_instruction_task: Sell
                  ai_instruction_variables:
                    shop: X
                  ai_instructions: ""
                  ai_workflow: null
                  can_escalate: true
                  created_admin:
                    avatar_url: null
                    email: somchai@example.com
                    id: 104
                    name: Somchai Jaidee
                    role: owner
                  created_admin_id: 104
                  created_at: "2026-05-25T11:05:00Z"
                  description: Sells things
                  immediate_response: null
                  name: Publish Me
                  profile_url: null
                  published_admin_id: 106
                  published_at: "2026-05-25T11:30:00Z"
                  slug: ingfah-agent-publish-me
                  teams: []
                  type: audio
                  updated_at: "2026-09-09T16:08:00Z"
                  visibility: public
                  vocal_name: Mali
                  voice: null
                  voice_speed: null
                status: success
              schema:
                $ref: '#/components/schemas/DetailDataType2'
          description: OK
        "401":
          content:
            application/json:
              example:
                error: unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Unauthorized
        "404":
          content:
            application/json:
              example:
                error: resource not found
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Not Found
      security:
      - apiKey: []
      summary: Get agent
      tags:
      - Agents
  /client/agents/{slug}/chat-session-tests:
    get:
      description: |-
        The test conversations run against an agent from the editor, newest first — apart from real customer sessions, which are under Chat sessions. Each says which version of the agent was under test. Offset pagination by default; `pagination_mode=cursor` walks the list by cursor instead, with `cursor` in the response in place of `pagination`: take `backward_cursor` apart into `cursor_id` and `cursor_start_time` and ask for `direction=backward` to get the next page.

        API key scope: `chat_sessions:read`.
      operationId: listAgentChatSessionTests
      parameters:
      - description: The agent's slug.
        in: path
        name: slug

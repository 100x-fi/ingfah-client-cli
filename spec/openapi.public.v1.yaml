        schema:
          description: The AI team's id.
          example: 12
          minimum: 0
          type: integer
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  automation_types:
                  - automation_type: http
                    config_fields:
                    - description: URL to send the request to.
                      description_th: URL ปลายทางที่จะส่ง request ไป
                      example: https://crm.example.com/calls
                      key: url
                      required: true
                      secret: false
                      type: string
                    - description: HTTP method. POST when left empty.
                      description_th: HTTP method ที่ใช้ส่ง ถ้าไม่ระบุจะใช้ POST
                      key: method
                      options:
                      - GET
                      - POST
                      - PUT
                      - PATCH
                      - DELETE
                      required: false
                      secret: false
                      type: enum
                    - description: HTTP headers to send, e.g. your auth token. Hidden
                        once saved.
                      description_th: HTTP headers ที่จะส่งไป เช่น token สำหรับยืนยันตัวตน
                        จะถูกซ่อนหลังบันทึก
                      key: headers
                      required: false
                      secret: true
                      type: json
                    - description: Request body to send, as JSON.
                      description_th: body ของ request ที่จะส่งไป ในรูปแบบ JSON
                      key: body
                      required: false
                      secret: false
                      type: json
                    label_th: Webhook (http)
                    trigger_events:
                    - session_started
                    - session_ended
                  - automation_type: do_not_contact
                    config_fields:
                    - description: How many days not to call the number, at least
                        1. Never call it again when left empty.
                      description_th: จำนวนวันที่ห้ามโทร อย่างน้อย 1 วัน ถ้าไม่ระบุจะห้ามโทรถาวร
                      example: "30"
                      key: duration_days
                      required: false
                      secret: false
                      type: number
                    label_th: Do not contact
                    trigger_events:
                    - session_started
                    - session_ended

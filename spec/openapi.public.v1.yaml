    get:
      description: |-
        The tools a text agent may use in a chat — hand off to a human, send an image… — the platform's global ones plus the client's own, paginated. Their ids go in an agent's or revision's `text_chat_tools`.

        API key scope: `ai_agents:read`.
      operationId: listTextChatTools
      parameters:
      - description: Defaults to 1.
        in: query
        name: page

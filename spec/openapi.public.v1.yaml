            when it is omitted.
          minimum: 0
          nullable: true
          type: integer
      - description: RFC3339. Required unless batch_id is given; must be sent together
          with to.
        in: query
        name: from
        schema:
          description: RFC3339. Required unless batch_id is given; must be sent together
            with to.
          example: "2026-09-01T00:00:00+07:00"
          nullable: true
          type: string
      - description: RFC3339. The range between from and to cannot exceed 93 days.
        in: query
        name: to
        schema:
          description: RFC3339. The range between from and to cannot exceed 93 days.
          example: "2026-09-24T23:59:59+07:00"
          nullable: true
          type: string

  /client/phone-tools:
    get:
      description: |-
        The phone tools an audio agent may use on a call — transfer to a human, send DTMF, hang up… — the platform's global ones plus the client's own, paginated. Their ids go in an agent's or revision's `phone_tools`.

        API key scope: `ai_agents:read`.
      operationId: listPhoneTools
      parameters:
      - description: Defaults to 1.
        in: query
        name: page
        schema:
          description: Defaults to 1.
          example: 1
          nullable: true
          type: integer
      - description: Defaults to 20, at most 100.
        in: query
        name: per_page
        schema:
          description: Defaults to 20, at most 100.
          example: 20
          nullable: true
          type: integer
      - description: Partial match on name and description.
        in: query
        name: search
        schema:
          description: Partial match on name and description.
          example: transfer
          nullable: true
          type: string
      - description: Comma-separated tool ids.
        in: query
        name: ids
        schema:
          description: Comma-separated tool ids.
          example: 1,2,3
          nullable: true
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - client_id: null
                  description: Transfer the call to a human
                  id: 5
                  implementation_name: null
                  name: transfer_call
                  params:
                    properties:
                      to:
                        type: string
                    type: object
                pagination:
                  has_next: false
                  has_prev: false
                  page: 1
                  per_page: 10
                  total: 1
                  total_pages: 1
                status: success
              schema:
                $ref: '#/components/schemas/PhoneToolPage'
          description: OK
        "400":
          content:
            application/json:
              example:
                error: invalid request
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Bad Request
        "401":
          content:
            application/json:
              example:
                error: unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Forbidden
      security:
      - apiKey: []
      summary: List phone tools
      tags:
      - Phone tools
    post:
      description: |-
        Creates a task of the caller's client: Goal (`agent_task`), Troubleshoot (`troubleshoot_task`) or Form (`form_task`). `params` takes only the keys `[GET] /client/phone-tools/catalog` lists for that kind; voice settings and unknown keys are a 400 naming the key, and only `max_history_items` takes null. A Form is checked field by field as the AI Agent reads it on a call: `params.fields` is required (1-30 fields), each field's `type` is one of text, int, enum, phone_th, digits, email, an enum needs `values`, `when` may only name an earlier field, and `confirm` only spoken fields; a failure is a 400 naming the field. The name must be 1-64 letters, digits or `_`, and not used by another phone tool or Tool (MCP) of the client, or a global one (`PHONE_TOOL_NAME_TAKEN`). A client has at most 50 tasks, Form included (`PHONE_TOOL_LIMIT_REACHED`). `extra_tools` takes ids of the client's own or global phone tools that are not tasks. The response is the task as `[GET] /client/phone-tools/{id}` shows it.

        API key scope: `ai_agents:write`.
      operationId: createPhoneTool
      requestBody:
        content:
          application/json:
            examples:
              form:
                summary: form
                value:
                  description: ใช้เมื่อลูกค้าบอกว่าเปลี่ยนเบอร์หรือที่อยู่ติดต่อ
                  implementation_name: form_task
                  name: collect_contact
                  params:
                    confirm:
                      fields:
                      - contact_phone
                    fields:
                    - ask: ขอชื่อผู้ติดต่อค่ะ
                      name: contact_name
                      required: true
                      type: text
                    - ask: ขอเบอร์โทรที่ติดต่อได้ค่ะ
                      name: contact_phone
                      required: true
                      say_as: thai_number_as_digit
                      type: phone_th
                    intro: ขอเก็บข้อมูลติดต่อใหม่นะคะ
                    on_result:
                      success: ขอบคุณลูกค้า แล้วคุยเรื่องยอดค้างต่อ
              goal:
                summary: goal
                value:
                  description: ใช้เมื่อต้องถามวันที่ลูกค้าจะจ่าย
                  implementation_name: agent_task
                  name: confirm_pay_date
                  params:
                    extra_tools:
                    - 3
                    goal: ถามว่าลูกค้าจะจ่ายยอดค้างวันไหน
                    output_fields:
                      pay_date: วันที่ลูกค้าบอกว่าจะจ่าย
              troubleshoot:
                summary: troubleshoot
                value:
                  description: ใช้เมื่อลูกค้าบอกว่าเข้าแอปไม่ได้
                  implementation_name: troubleshoot_task
                  name: fix_app_login
                  params:
                    extra_instruction: พูดช้าๆ รอให้ลูกค้าทำเสร็จทีละขั้น
                    on_result:
                      not_resolved: เสนอโอนสายให้เจ้าหน้าที่
            schema:
              $ref: '#/components/schemas/CreatePhoneToolBody'
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  client_id: 101
                  description: ใช้เมื่อต้องถามวันที่ลูกค้าจะจ่าย
                  id: 5
                  implementation_name: agent_task
                  name: confirm_pay_date
                  params:
                    goal: ถามว่าลูกค้าจะจ่ายยอดค้างวันไหน
                    output_fields:
                      pay_date: วันที่ลูกค้าบอกว่าจะจ่าย
                status: success
              schema:
                $ref: '#/components/schemas/PhoneToolData'
          description: OK
        "400":
          content:
            application/json:
              examples:
                limit:
                  summary: limit
                  value:
                    error: bad request
                    errors:
                    - code: PHONE_TOOL_LIMIT_REACHED
                      detail: a client can have at most 50 tasks
                    status: error
                name_taken:
                  summary: name taken
                  value:
                    error: bad request
                    errors:
                    - code: PHONE_TOOL_NAME_TAKEN
                      detail: name confirm_pay_date is already used by another tool
                    status: error
                voice_key:
                  summary: voice key
                  value:
                    error: invalid request
                    status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Bad Request
        "401":
          content:
            application/json:
              example:
                error: unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Forbidden
      security:
      - apiKey: []
      summary: Create a task
      tags:
      - Phone tools
  /client/phone-tools/{id}:
    delete:
      description: |-
        Deletes a task of the caller's client (Goal, Troubleshoot or Form), including one the ingfah team made for it. A task an AI Agent still uses, published or in its latest revision (a draft included), is a 409 `PHONE_TOOL_IN_USE` whose `data.agents` lists those agents (`id`, `name`, `slug`, `profile_url`), sorted by id: remove it from them first. Older revisions and deleted AI Agents do not count; their links go with the task. A global tool, a warm transfer or any other kind that is not a task is a 403; another client's tool is a 404. Every delete writes an activity log row `phone_tool.delete`.

        API key scope: `ai_agents:write`.

            minimum: 0
            type: integer
          type: array
        text_chat_tools:
          description: Ids of the text chat tools the agent may use; always dropped
            for audio agents.
          example:
          - 1
          items:
            minimum: 0
            type: integer
          type: array
        vocal_name:
          description: How the agent introduces itself on a call.
          example: มะลิ

            asked for.
          example: 2
          type: integer
        called:
          description: Answered.
          example: 12
          type: integer
        calling:
          description: On the line now.
          example: 1
          type: integer
        dnc:
          description: On the do-not-contact list, so never called. Present only when
            there is such a row.
          example: 1
          type: integer
        error:
          description: Could not be placed. On Get batch, only the rows with no retry
            left.
          example: 0
          type: integer
        missed:
          description: Not answered. On Get batch, only the rows with no retry left.
          example: 3
          type: integer
        pending:
          description: Not called yet, or waiting for a callback. On Get batch, also
            a missed, busy or error row the batch will still retry (call_pending on
            List batch records).
          example: 84
          type: integer
      required:

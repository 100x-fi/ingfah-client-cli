          minimum: 0
          nullable: true
          type: integer
        parameters:
          description: The arguments the agent called the tool with. Tool calls only.
        reply_to:
          allOf:
          - $ref: '#/components/schemas/ChatsessionsMessage'
          description: 'The message a text chat line replied to (pressed reply on
            in LINE): a customer''s reply to theirs, the AI''s or an admin''s message,
            or an admin''s reply from the Inbox, possibly to a message from an earlier
            session of the conversation. The same shape one level deep; its own reply_to
            is always null. null on every other entry.'
          nullable: true
          type: object
        response:
          description: What the tool returned. Tool calls only.
        role:
          description: 'assistant: the agent spoke; user: the customer spoke; tool:
            the agent called a tool.'

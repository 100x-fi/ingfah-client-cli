          enum:
          - voice
          - dtmf
          type: string
        default:
          description: The answer used when the caller gives none; for an enum, one
            of values.
          type: string
        description:
          description: What the field holds, for the AI Agent.
          type: string
        dtmf:
          additionalProperties: {}
          description: Settings of a keypad field, keys as the catalog lists them;
            dtmf.min_digits is at most dtmf.max_digits, each taken from the field
            when unset, then 1 / 32 (9 / 10 for phone_th).
          type: object
        label:
          description: The field's name as read back to the caller.
          type: string
        max:
          description: Largest answer an int field accepts.
          nullable: true
          type: integer
        max_digits:
          description: Most digits a digits field accepts. Default 32.
          nullable: true
          type: integer
        max_tries:
          description: How many times the field is asked, at least 1. Default 2.
          nullable: true
          type: integer
        min:
          description: Smallest answer an int field accepts.
          nullable: true
          type: integer
        min_digits:
          description: Fewest digits a digits field accepts, at most max_digits. Default
            1.
          nullable: true
          type: integer
        name:
          description: 'The field''s name: not a Python keyword, unique in the form.'
          example: contact_name
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          type: string
        readback:
          description: The phrase the answer is read back in; contains {value}.
          type: string
        required:
          description: Whether the form needs an answer for this field; not with volunteer_only.
          type: boolean
        say_as:
          description: How the voice reads the answer back, a TTS say-as type.
          example: thai_number_as_digit
          type: string
        speak:
          description: Whether the answer is read back. Default true.
          nullable: true
          type: boolean
        type:
          description: What the answer must be. Default text.
          enum:
          - text
          - int
          - enum
          - phone_th
          - digits
          - email
          example: phone_th
          type: string
        values:
          description: The choices of an enum field; required, not empty, for type
            enum.
          items:
            type: string
          type: array
        volunteer_only:
          description: Never asked; saved only when the caller offers it. Not with
            required.
          type: boolean
        when:
          additionalProperties: {}
          description: 'Ask the field only when earlier fields have these answers:
            an earlier field''s name to a string or a list of strings.'
          type: object
      required:
      - name
      type: object
    PhonetoolsFormParams:
      properties:

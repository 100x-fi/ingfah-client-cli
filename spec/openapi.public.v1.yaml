    ChatsessionsMessage:
      properties:
        ai_agent:
          allOf:
          - $ref: '#/components/schemas/ChatsessionsMessageAgent'
          description: The agent that spoke, or on a tool call the agent that made
            it; absent on the customer's lines.
          nullable: true
          type: object
        attachment:
          allOf:
          - $ref: '#/components/schemas/TextchatsAttachment'
          description: Only on a text chat's video, file or audio message.
          nullable: true
          type: object
        chat_log_type:
          description: text for a spoken line; empty for a tool call.
          example: text
          type: string
        content:
          description: What was said. Spoken lines only.
          example: สวัสดีค่ะ อิงฟ้าประกันภัยยินดีให้บริการค่ะ
          nullable: true
          type: string
        elapsed_ms:
          description: Milliseconds from the session's start_time to this line (its
            timestamp) or tool call (its start_time), never below 0, from the stored
            times rather than the whole-second strings. null for a text chat, or when
            the session's or this entry's time is missing. In child_sessions it counts
            from that child's own start_time. Always null on reply_to.
          example: 100000
          format: int64
          minimum: 0
          nullable: true
          type: integer
        end_time:
          description: Tool calls only.
          example: "2026-05-25T11:05:32Z"
          nullable: true
          type: string
        id:
          description: Spoken lines only.
          example: 1001
          minimum: 0
          nullable: true
          type: integer
        media_group:
          allOf:
          - $ref: '#/components/schemas/ChatsessionsMessageMediaGroup'
          description: The set of images a customer sent together that this text chat
            image belongs to. null on every other entry, on an image sent alone, and
            on an image that could not be loaded.
          nullable: true
          type: object
        parameters:
          description: The arguments the agent called the tool with. Tool calls only.
        reply_to:
          allOf:
          - $ref: '#/components/schemas/ChatsessionsMessage'
          description: 'The message a text chat line replied to (pressed reply on
            in LINE): a customer''s reply to theirs, the AI''s or an admin''s message,
            or an admin''s reply from the Inbox, possibly to a message from an earlier
            session of the conversation. The same shape one level deep; its own reply_to
            is always null. null on every other entry.'
          nullable: true
          type: object
        response:
          description: What the tool returned. Tool calls only.
        role:
          description: 'assistant: the agent spoke; user: the customer spoke; tool:
            the agent called a tool; human_agent: a staff member spoke after a warm
            transfer joined them to the call (no ai_agent). human_agent is on the
            main session only: a line the voice agent reported as the AI''s with no
            turn_id, starting no earlier than the child session whose end_reason is
            merged_to_caller_room. In child_sessions the staff member stays user.'
          enum:
          - assistant
          - user
          - tool
          - human_agent
          example: assistant
          type: string
        start_time:
          description: Tool calls only.
          example: "2026-05-25T11:05:31Z"
          nullable: true
          type: string
        status:
          description: 'Tool calls only. calling: no response yet; failed: the runtime
            flagged the response as an error; error: the tool itself answered with
            status error.'
          enum:
          - calling
          - success
          - failed
          - error
          example: success
          nullable: true
          type: string
        text_delivery_status:
          description: 'Whether a text chat''s AI reply reached the customer: sent
            or failed once the push to the provider returns. null on every other entry,
            and on an AI reply still being sent.'
          enum:
          - sent
          - failed
          example: sent
          nullable: true
          type: string
        text_delivery_status_reason:
          description: 'Why the AI reply did not reach the customer: the error the
            provider push returned, as is. Set only when text_delivery_status is failed;
            null otherwise, and on replies that failed before this field existed.'
          example: 'line message failed: status=401 body={"message":"Authentication
            failed due to the following reason: invalid token. Confirm that the access
            token in the authorization header is valid."}'
          nullable: true
          type: string
        text_delivery_status_updated_at:
          description: When text_delivery_status was set; null while it is.
          example: "2026-05-25T11:05:04Z"
          nullable: true
          type: string
        timestamp:
          description: When the line was spoken. Spoken lines only.
          example: "2026-05-25T11:05:03Z"
          nullable: true
          type: string
        tool_name:
          description: Tool calls only.
          example: lookup_policy
          nullable: true
          type: string
      required:
      - role
      - chat_log_type
      - elapsed_ms
      type: object

          type: string
        start_time:
          description: Tool calls only.
          example: "2026-05-25T11:05:31Z"
          nullable: true
          type: string
        status:
          description: 'Tool calls only. calling: no response yet; failed: the runtime
            flagged the response as an error; error: the tool itself answered with
            status error.'
          enum:
          - calling
          - success
          - failed
          - error
          example: success
          nullable: true
          type: string
        text_delivery_status:
          description: 'Whether a text chat''s AI reply reached the customer: sent
            or failed once the push to the provider returns. null on every other entry,
            and on an AI reply still being sent.'
          enum:
          - sent
          - failed
          example: sent
          nullable: true
          type: string
        text_delivery_status_reason:
          description: 'Why the AI reply did not reach the customer: the error the
            provider push returned, as is. Set only when text_delivery_status is failed;
            null otherwise, and on replies that failed before this field existed.'
          example: 'line message failed: status=401 body={"message":"Authentication
            failed due to the following reason: invalid token. Confirm that the access
            token in the authorization header is valid."}'
          nullable: true
          type: string
        text_delivery_status_updated_at:
          description: When text_delivery_status was set; null while it is.
          example: "2026-05-25T11:05:04Z"
          nullable: true
          type: string
        timestamp:
          description: When the line was spoken. Spoken lines only.
          example: "2026-05-25T11:05:03Z"
          nullable: true
          type: string
        tool_name:
          description: Tool calls only.
          example: lookup_policy
          nullable: true
          type: string

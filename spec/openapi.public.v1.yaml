  /client/chat-sessions/{uuid}:
    get:
      description: |-
        One call in full: the transcript as the agent and the customer spoke it, the tools the agent called, the summary and outcome once the call has ended, and the admins who listened in. Whether a recording exists is `has_audio_record`. Each row of `messages` and `admin_monitors` carries `elapsed_ms`, its offset from the session's `start_time`, to line it up with the recording. The staff numbers a warm transfer dialed are in `child_sessions`; a child's own id is 404 here.

        API key scope: `chat_sessions:read`.
      operationId: getChatSession
      parameters:
      - description: The session's UUID.
        in: path
        name: uuid
        required: true
        schema:
          description: The session's UUID.
          example: 9f1c7e2a-1b3d-4c5e-8a90-111111111111
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  admin_monitors: []
                  child_sessions: []
                  client_outbound_batch:
                    client_batch_id: 7
                    created_at: "2026-05-20T09:00:00Z"
                    name: Outbound Line Batch
                  client_phone: "+6621234567"
                  conversation_id: null
                  customer_phone: "+66812345678"
                  direction: outbound
                  disposition_outcome_updated_admin:
                    display_name: ""
                    email: ""
                  end_reason: null
                  end_time: "2026-05-25T11:20:07Z"
                  ended_by: null
                  has_audio_record: false
                  id: 9f1c7e2a-1b3d-4c5e-8a90-111111111111
                  messages:
                  - ai_agent:
                      id: 8
                      is_deleted: false
                      name: Outbound Line Agent
                      profile_url: null
                      slug: ingfah-agent-outbound-line-agent
                    chat_log_type: text
                    content: สวัสดีค่ะ คุณสมชาย
                    elapsed_ms: 100000
                    id: 1001
                    media_group: null
                    reply_to: null
                    role: assistant
                    text_delivery_status: null
                    text_delivery_status_reason: null
                    text_delivery_status_updated_at: null
                    timestamp: "2026-05-25T11:05:03Z"
                  outcome_metadata: null
                  start_time: "2026-05-25T11:05:00Z"
                  summary: null
                  title: null
                status: success
              schema:
                $ref: '#/components/schemas/DetailDataType4'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Bad Request
        "401":
          content:
            application/json:
              example:
                error: unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Unauthorized
        "404":
          content:
            application/json:
              example:
                error: resource not found
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Not Found
      security:
      - apiKey: []
      summary: Get chat session
      tags:
      - Chat sessions
  /client/chat-sessions/{uuid}/record:
    get:
      description: |-
        A link to the call's audio file, valid for 15 minutes, with its checksum. `uuid` may also be a child session's id (`child_sessions[].id`) whose main session belongs to the caller's client: the file is then that leg's own recording, and a link or a download is logged with the child's id. 404 when the session does not exist or has no recording (`has_audio_record` false). The file is the first that is in storage of the agent's own recording, the telephony box's and LiveKit's; a file that never reached storage is looked up as if there were none. 404 when no source has a file in storage.

        API key scope: `chat_sessions:read`.
      operationId: getChatSessionRecord
      parameters:
      - description: The session's UUID.
        in: path
        name: uuid
        required: true
        schema:
          description: The session's UUID.
          example: 9f1c7e2a-1b3d-4c5e-8a90-111111111111
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordURLData'
          description: OK
        "401":
          content:
            application/json:
              example:
                error: unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                error: resource not found
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Not Found
      security:
      - apiKey: []
      summary: Get call recording URL
      tags:
      - Chat sessions
  /client/chat-sessions/{uuid}/record/checksum:
    get:
      description: |-
        The audio file's SHA-256, for checking a download, without a link or the file. `uuid` may also be a child session's id (`child_sessions[].id`) whose main session belongs to the caller's client: the file is then that leg's own recording, and a link or a download is logged with the child's id. 404 when the session does not exist or has no recording (`has_audio_record` false). The file is the first that is in storage of the agent's own recording, the telephony box's and LiveKit's; a file that never reached storage is looked up as if there were none. 404 when no source has a file in storage.

        API key scope: `chat_sessions:read`.
      operationId: getChatSessionRecordChecksum
      parameters:
      - description: The session's UUID.
        in: path
        name: uuid
        required: true
        schema:
          description: The session's UUID.
          example: 9f1c7e2a-1b3d-4c5e-8a90-111111111111
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordChecksumData'
          description: OK
        "401":
          content:
            application/json:
              example:
                error: unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                error: resource not found
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Not Found
      security:
      - apiKey: []
      summary: Get call recording checksum
      tags:
      - Chat sessions
  /client/chat-sessions/{uuid}/record/download:
    get:
      description: |-
        The call's audio file itself, as Ogg (`Content-Disposition: attachment; filename="<uuid>.ogg"`). `uuid` may also be a child session's id (`child_sessions[].id`) whose main session belongs to the caller's client: the file is then that leg's own recording, and a link or a download is logged with the child's id. 404 when the session does not exist or has no recording (`has_audio_record` false). The file is the first that is in storage of the agent's own recording, the telephony box's and LiveKit's; a file that never reached storage is looked up as if there were none. 404 when no source has a file in storage.


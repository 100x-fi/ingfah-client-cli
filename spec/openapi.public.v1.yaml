          description: 'How long each number rings. Required when the list, after
            the edit, has more than one number; null: no limit.'
          example: 20
          maximum: 120
          minimum: 5
          nullable: true
          type: integer
        shuffle_target_phone_numbers:
          description: 'Dial the numbers in random order. null: off.'
          example: true
          nullable: true
          type: boolean
        success_message:
          description: 'Spoken word for word when a human agent answers; saving it
            drops the instruction the ingfah team set for it. "" or null: silent.'
          example: เจ้าหน้าที่รับสายแล้วค่ะ
          maxLength: 500
          nullable: true
          type: string
        target_phone_numbers:
          description: 'Replaces the list: 1-10 numbers, each ^\+?[0-9]{3,15}$, no
            repeats, dialled in order. null is not allowed.'
          example:
          - "0811112222"
          - "1102"
          items:
            type: string
          maxItems: 10
          minItems: 1
          type: array
          uniqueItems: true
        timeout_seconds:
          description: 'How long the whole transfer may take. null: no limit.'
          example: 120
          maximum: 600
          minimum: 10
          nullable: true
          type: integer
      type: object

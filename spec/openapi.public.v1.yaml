        Starts a calling campaign: the records are called by the schedule's AI team, within its days and hours, from the given numbers, retried per `retry_policy`. Before this works the client needs an active license and at least one phone number, and the team must be outbound with a published starting agent. A 200 means the batch was created (status `running`). If any row is rejected, nothing is created and the response is a 422 with error `unprocessable entity` and the rejected rows in `invalids`. A 422 with error `incomplete config` means the AI team is not fully set up.

        API key scope: `client_outbound_batches:write`.
      operationId: createOutboundBatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundCreateBatchBody'
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  id: 7
                  name: September follow-up
                  uploaded_key: acme/outbound_files/7_June_renewals.csv
                status: success
              schema:
                $ref: '#/components/schemas/CreateBatchResultData'
          description: OK
        "400":
          content:
            application/json:
              example:
                error: bad request
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Bad Request
        "401":
          content:
            application/json:
              example:
                error: unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Not Found
        "422":
          content:
            application/json:
              example:
                data:
                  invalids:
                  - column: phone_number
                    error: DUPLICATE_PHONE_NUMBER
                    row_numbers:
                    - 1
                    - 2
                error: unprocessable entity
                status: error
              schema:
                $ref: '#/components/schemas/OutboundCreateBatchRejected'
          description: Unprocessable Entity
      security:
      - apiKey: []
      summary: Create outbound batch
      tags:
      - Outbound batches

  /crm/users/{id}:
    get:
      description: |-
        The client's CRM user with this id, in the shape of one row of GET /crm/users. An id of another client's user, an unknown one, or one that is not a uuid is 404.

        API key scope: `crm_client_users:read`.
      operationId: crmGetUserByID
      parameters:
      - description: The CRM user's id, a uuid. One of another client, unknown, or
          not a uuid is 404.
        in: path
        name: id
        required: true
        schema:
          description: The CRM user's id, a uuid. One of another client, unknown,
            or not a uuid is 404.
          example: 6f1c2a4e-8b0d-4c3f-9a51-2e7d90b4c812
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmUserData'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Not Found
      security:
      - apiKey: []
      summary: Get CRM user by id
      tags:
      - CRM
    patch:
      description: |-
        Changes the fields sent for the client's CRM user with this id, its phone and client_external_id included; the others are kept. An id of another client's user, an unknown one, or one that is not a uuid is 404: it never adds a user. A phone or client_external_id another CRM user of the same client has is 409; the same value at another client is no conflict. Each call writes one crm_client_user.update activity log, which carries the user's id as entity.id and do_not_contact when sent, never the phone number, name, client_external_id or metadata.

        API key scope: `crm_client_users:write`.
      operationId: crmUpdateUserByID
      parameters:
      - description: The CRM user's id, a uuid. One of another client, unknown, or
          not a uuid is 404.
        in: path
        name: id
        required: true
        schema:
          description: The CRM user's id, a uuid. One of another client, unknown,
            or not a uuid is 404.
          example: 6f1c2a4e-8b0d-4c3f-9a51-2e7d90b4c812
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrmUpdateUserByIDBody'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmUserData'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Conflict
      security:
      - apiKey: []
      summary: Update CRM user by id
      tags:
      - CRM
  /v1/synthesize:
    post:
      description: Convert text to speech and return raw PCM audio.
      operationId: speechSynthesize
      requestBody:
        content:
          application/json:
            schema:
              properties:
                text:
                  description: Text to synthesize
                  example: สวัสดีค่ะ บริษัทอิงฟ้ายินดีให้บริการ วันนี้มีอะไรให้ช่วยคะ
                  type: string
                voice:
                  description: Speech profile name
                  example: ingfah
                  type: string
              required:
              - voice
              - text
              type: object
        required: true
      responses:
        "200":
          content:
            audio/pcm:
              schema:
                format: binary
                type: string
          description: Raw PCM audio data
        "400":
          description: Missing or invalid request body
        "401":
          description: Unauthorized
      security:
      - speechBearer: []
      servers:
      - url: https://speech-api.ingfah.ai
      summary: Synthesize speech
      tags:
      - Speech API (REST)
components:

          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Forbidden
      security:
      - apiKey: []
      summary: List CRM users
      tags:
      - CRM
  /v1/synthesize:
    post:
      description: Convert text to speech and return raw PCM audio.
      operationId: speechSynthesize
      requestBody:
        content:
          application/json:
            schema:
              properties:
                text:
                  description: Text to synthesize
                  example: สวัสดีค่ะ บริษัทอิงฟ้ายินดีให้บริการ วันนี้มีอะไรให้ช่วยคะ
                  type: string
                voice:
                  description: Speech profile name
                  example: ingfah
                  type: string
              required:
              - voice
              - text
              type: object
        required: true
      responses:
        "200":
          content:
            audio/pcm:
              schema:
                format: binary
                type: string
          description: Raw PCM audio data
        "400":
          description: Missing or invalid request body
        "401":
          description: Unauthorized
      security:
      - speechBearer: []
      servers:
      - url: https://speech-api.ingfah.ai
      summary: Synthesize speech
      tags:
      - Speech API (REST)

          - desc
          nullable: true
          type: string
      - description: Only rows whose latest call came to one of these outcomes, comma
          separated; "null" lists the rows with no outcome yet.
        in: query
        name: disposition_outcome
        schema:
          description: Only rows whose latest call came to one of these outcomes,
            comma separated; "null" lists the rows with no outcome yet.

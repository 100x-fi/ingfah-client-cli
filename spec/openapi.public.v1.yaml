        What an automation form for the team is built from: the trigger events it may pick (session_ended, on a text team handoff_to_human, and on an outbound audio team pre_outbound_call; session_started is not offered), each with the session.* variables a jinja can read (handoff_to_human also its handoff.*; pre_outbound_call, which comes before any session, the row about to be called, its outbound_batch and schedule, sip_number and is_callback instead), and the automation types that run their config as given (http, do_not_contact), each with the events it runs on and the fields of its config. Only what the team's channel_type has: a text team gets http only, which also runs on handoff_to_human, and no session.client_phone or session.customer_phone; an audio team no session.text_chat_conversation_id. No team is offered session.client_id, session.client_product_id, session.chat_sid or session.audio_record_url.

        API key scope: `client_products:read`.
      operationId: getProductAutomationCatalog
      parameters:
      - description: The AI team's id.
        in: path
        name: id
        required: true
        schema:
          description: The AI team's id.
          example: 12
          minimum: 0
          type: integer
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  automation_types:
                  - automation_type: http
                    config_fields:
                    - description: URL to send the request to.
                      description_th: URL ปลายทางที่จะส่ง request ไป
                      example: https://crm.example.com/calls
                      key: url
                      required: true
                      secret: false
                      type: string
                    - description: HTTP method. POST when left empty.
                      description_th: HTTP method ที่ใช้ส่ง ถ้าไม่ระบุจะใช้ POST
                      key: method
                      options:
                      - GET
                      - POST
                      - PUT
                      - PATCH
                      - DELETE
                      required: false
                      secret: false
                      type: enum
                    - description: 'HTTP headers to send. Put tokens in client secrets

    OutboundCallDataRecord:
      properties:
        batch_id:
          description: The batch's client_batch_id.
          example: 17
          minimum: 0
          type: integer
        batch_name:
          example: AEON collection 24 Sep
          type: string
        client_phone:
          description: The number the call was placed from.
          example: "021234567"
          nullable: true
          type: string
        created_at:
          description: When the record was picked to dial.
          example: "2026-09-24T03:00:00.120Z"
          type: string
        customer_phone:
          example: "0812345678"
          type: string
        outbound_batch_record_id:
          description: The row's id, as List batch records returns it.
          example: 9087
          minimum: 0
          type: integer
        row_number:
          example: 42
          minimum: 0
          type: integer
        sip_answered_at:
          description: Null if the far end never answered.
          nullable: true
          type: string
        sip_disposition:
          description: Null if the attempt never reached SIP.
          example: BUSY
          nullable: true
          type: string
        sip_ended_at:
          example: "2026-09-24T03:00:31.480Z"
          nullable: true
          type: string
        sip_hangup_cause:
          description: '{sip, q850} as the SIP box reported it; null is the common
            case (an answered call, or one that rang until the timeout, reports no
            reason).'
        sip_started_at:
          description: When the call was sent to SIP. Null if the attempt never reached
            SIP.
          example: "2026-09-24T03:00:01.480Z"
          nullable: true
          type: string
        status:
          enum:
          - pending
          - missed
          - busy
          - calling
          - dialing
          - error
          - called
          - dnc
          - callback
          example: missed
          type: string
        status_reason:
          description: e.g. dispatch_timeout when the agent never joined the room.
          nullable: true
          type: string
        updated_at:
          description: When the attempt's result landed.
          example: "2026-09-24T03:00:32.010Z"
          type: string
      required:
      - batch_id
      - batch_name
      - outbound_batch_record_id
      - row_number
      - customer_phone
      - status
      - created_at
      - updated_at
      - sip_hangup_cause
      type: object
    OutboundCreateBatchBody:

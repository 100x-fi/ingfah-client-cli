          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Not Found
      security:
      - apiKey: []
      summary: Export a TTS dictionary as CSV
      tags:
      - TTS dictionaries
    post:
      description: |-
        One of the client's sets, all or nothing. Any admin role may call this. The checks run in order and the first failure answers: a set that is missing or another client's answers 404; a global set answers 403 (only 100x changes one); both before the body is read. Then a body over 5 MB answers 413; then, each a 400: no file part or an empty one (TTS_DICTIONARY_MISSING_FILE), not UTF-8 or holding a NUL (TTS_DICTIONARY_INVALID_ENCODING; a Windows-874 save from Thai Excel lands here, so ask for "CSV UTF-8"), not CSV (TTS_DICTIONARY_INVALID_CSV, data.row), no word or pronunciation column (TTS_DICTIONARY_MISSING_COLUMN), one of them twice (TTS_DICTIONARY_DUPLICATE_COLUMN), bad rows (TTS_DICTIONARY_INVALID_ROWS, data.rows), then, under a row lock on the set, more than 10,000 words after the import (TTS_DICTIONARY_TOO_MANY_WORDS). A word is matched to the set's words as typed (US and us are two words): a new one is added, one with another pronunciation takes the file's, the rest are left; words not in the file stay. Added and changed words, and the set when any is, get the caller as their last editor (for an API key, the admin who created the key). A header-only file answers every count 0. One activity log row per import, not on a dry run. A write through an API key whose creator admin no longer exists answers 401.


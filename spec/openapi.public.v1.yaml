  /client/products/{id}/chat-session-tests:
    get:
      description: |-
        The test calls run against a whole AI team, newest first, with the same query and pagination as an agent's list. A team test call starts at the team's starting agent, so each also says which version of that agent was under test. Another client's team is a 403, not a 404.

        API key scope: `chat_sessions:read`.
      operationId: listTeamChatSessionTests
      parameters:
      - description: The AI team's id.
        in: path
        name: id
        required: true
        schema:
          description: The AI team's id.
          example: 12
          minimum: 0
          type: integer
      - description: Defaults to offset.
        in: query
        name: pagination_mode
        schema:
          description: Defaults to offset.
          enum:
          - offset
          - cursor
          nullable: true
          type: string
      - description: 'Offset mode: from 1.'
        in: query
        name: page
        schema:
          description: 'Offset mode: from 1.'
          example: 1
          nullable: true
          type: integer
      - description: Defaults to 20.
        in: query
        name: per_page
        schema:
          description: Defaults to 20.
          example: 20
          nullable: true
          type: integer
      - description: Part of the title, case-insensitive.
        in: query
        name: search
        schema:
          description: Part of the title, case-insensitive.
          example: refund
          nullable: true
          type: string
      - description: Only tests of this kind; both when absent.
        in: query
        name: chat_type
        schema:
          description: Only tests of this kind; both when absent.
          enum:
          - audio
          - text
          nullable: true
          type: string
      - description: 'Cursor mode: oldest first. Offset mode is always newest first.'
        in: query
        name: asc
        schema:
          description: 'Cursor mode: oldest first. Offset mode is always newest first.'
          nullable: true
          type: boolean
      - description: 'Cursor mode: the UUID half of a cursor token; needs cursor_start_time
          and direction with it.'
        in: query
        name: cursor_id
        schema:
          description: 'Cursor mode: the UUID half of a cursor token; needs cursor_start_time
            and direction with it.'
          example: b6f1e2b0-6e6a-4b3a-9b0a-9e6a1e2b0b6f
          nullable: true
          type: string
      - description: 'Cursor mode: the time half of a cursor token, as given (RFC
          3339 with fractional seconds).'
        in: query
        name: cursor_start_time
        schema:
          description: 'Cursor mode: the time half of a cursor token, as given (RFC
            3339 with fractional seconds).'
          example: "2026-08-01T09:12:00.412513Z"
          nullable: true
          type: string
      - description: 'Cursor mode: backward for the rows after the cursor in the list''s
          order (the next page), forward for the rows before it (what is newer, in
          the default order).'
        in: query
        name: direction
        schema:
          description: 'Cursor mode: backward for the rows after the cursor in the
            list''s order (the next page), forward for the rows before it (what is
            newer, in the default order).'
          enum:
          - forward
          - backward
          nullable: true
          type: string

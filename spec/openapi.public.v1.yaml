    ProductsCreateAutomationBody:
      properties:
        automation_config_jinja:
          description: 'Jinja template rendering to the automation''s config, a JSON
            object of the config_fields the catalog lists for automation_type. It
            sees what trigger_condition_jinja sees; splice a value with | tojson.
            Required when a field is (http: url); do_not_contact may leave it out
            (for good). A template that does not compile, reads a variable its trigger_event
            does not have, or does not render, with sample values, to the type''s
            fields (every required one, an enum one of its options) is a 400.'
          example: '{"url": "https://crm.example.com/calls", "body": {"phone": {{
            session.customer_phone | tojson }}}}'
          nullable: true
          type: string
        automation_type:
          description: 'One of the types the catalog lists: http sends the rendered
            request; do_not_contact puts the session''s customer phone on the do-not-contact
            list.'
          enum:
          - http
          - do_not_contact
          example: http
          type: string
        is_enabled:
          description: Defaults to true.
          example: true
          nullable: true
          type: boolean
        pre_outbound_call_timeout_seconds:
          description: 'pre_outbound_call only: how long the call waits for the automation,
            in seconds, 1 to 30. Omitted: 5. Sent on any other trigger_event, or out
            of range, it is a 400.'
          example: 5
          nullable: true
          type: integer
        trigger_condition_jinja:
          description: 'Jinja template that decides whether the automation runs: only
            when it renders true. It sees the session fields its trigger_event declares,
            under session (e.g. session.disposition_outcome), and the client''s secrets
            by name, as secrets.NAME (see /client/secrets): the value at run time,
            never stored in the automation. A secret need not be saved yet, but a
            run that reads one the client does not have fails. Omitted: it runs on
            every event. A template that does not compile, reads a variable its trigger_event
            does not have (in any branch), or reads secrets other than by a fixed
            name (secrets.NAME or secrets["NAME"]) is a 400.'
          example: '{{ session.disposition_outcome == "wrong_number" }}'
          nullable: true
          type: string
        trigger_event:
          description: 'When it fires: one of the events the catalog lists for automation_type;
            any other (session_started among them) is a 400. pre_outbound_call (outbound
            audio teams, http only; a 400 on an inbound team) is attached to the team
            itself and runs before every outbound call of the team: the call is dialed
            only when it succeeds (or its condition is false) within pre_outbound_call_timeout_seconds.'
          enum:
          - pre_outbound_call
          - handoff_to_human
          - session_ended
          example: session_ended
          type: string
      required:
      - trigger_event
      - automation_type
      type: object

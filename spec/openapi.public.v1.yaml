        One row per outbound call attempt, from record picked to dial through the SIP leg's start/answer/end, newest first. Filter by from/to and/or batch_id (outbound_batches.client_batch_id); from/to are required together unless batch_id is given, and their range cannot exceed 93 days. A finished attempt that never reached SIP (e.g. dispatch_timeout) has null sip_* fields.

        API key scope: `client_outbound_batches:read`.
      operationId: listOutboundCallDataRecords
      parameters:
      - description: The batch's client_batch_id. Optional; from and to are required
          when it is omitted.
        in: query
        name: batch_id
        schema:
          description: The batch's client_batch_id. Optional; from and to are required
            when it is omitted.
          minimum: 0
          nullable: true
          type: integer
      - description: RFC3339. Required unless batch_id is given; must be sent together
          with to.
        in: query
        name: from
        schema:
          description: RFC3339. Required unless batch_id is given; must be sent together
            with to.
          example: "2026-09-01T00:00:00+07:00"
          nullable: true
          type: string
      - description: RFC3339. The range between from and to cannot exceed 93 days.
        in: query
        name: to
        schema:
          description: RFC3339. The range between from and to cannot exceed 93 days.
          example: "2026-09-24T23:59:59+07:00"
          nullable: true
          type: string
      - in: query
        name: page
        schema:
          nullable: true
          type: integer
      - description: Max 100.
        in: query
        name: per_page
        schema:
          description: Max 100.
          nullable: true
          type: integer

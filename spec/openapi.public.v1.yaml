      type: object
    SharelinksCreateBody:
      properties:
        expires_at:
          description: RFC 3339, any offset; truncated to whole seconds and stored
            UTC. Null or left out means never, pin only. Later than now and <= 23:59:59
            Asia/Bangkok of (today + 90 days).
          example: "2026-11-09T02:00:00Z"
          nullable: true
          type: string
        kind:
          description: 'public: a link with an expiry; pin: a link protected by a
            6-digit PIN, with or without an expiry.'
          enum:
          - public
          - pin
          type: string
        pin:
          description: 'pin links only: the PIN to set, exactly 6 digits as a string
            (leading zeros kept). Null or left out: ingfah generates one. Sent with
            kind public, or not 6 digits: 400 SHARE_LINK_PIN_INVALID.'
          example: "482913"
          nullable: true
          type: string
        resource_id:
          description: chat_sessions.id of a top-level call, or text_chat_conversations.id,
            by resource_type.
          example: 6f0f6f8e-6a5b-4a52-9b8e-0d0a7c2f4214
          type: string
        resource_type:
          description: chat_session = one top-level call (inbound or outbound); text_chat_conversation
            = a whole text chat conversation. Exact and lowercase.
          enum:
          - chat_session
          - text_chat_conversation
          type: string
      required:
      - resource_type
      - resource_id
      - kind
      type: object
    SharelinksLink:
      properties:
        created_at:
          type: string
        created_by:
          $ref: '#/components/schemas/SharelinksActor'
        expires_at:
          description: RFC 3339 UTC. Null means never expires (pin only).
          nullable: true
          type: string
        id:
          example: 31
          minimum: 0
          type: integer
        kind:
          enum:
          - public
          - pin
          type: string
        pin:
          description: 6 digits, leading zeros kept. Set while a pin link is active;
            null for public, and once expired or revoked.
          example: "048213"
          nullable: true
          type: string
        resource_id:
          description: The chat session's or the conversation's id.
          example: 6f0f6f8e-6a5b-4a52-9b8e-0d0a7c2f4214
          type: string
        resource_type:
          description: chat_session = one top-level call (inbound or outbound); text_chat_conversation
            = a whole text chat conversation.
          enum:
          - chat_session
          - text_chat_conversation
          type: string
        revoked_at:
          nullable: true
          type: string
        revoked_by:
          allOf:
          - $ref: '#/components/schemas/SharelinksActor'
          nullable: true
          type: object
        status:
          description: Computed. Always active right after a create.
          enum:
          - active
          - expired
          - revoked
          type: string
        url:
          description: FRONTEND_URL without its trailing / + /share/ + the token.
            Always set, so an expired or revoked link's URL can still be shown; it
            no longer opens (GET /share answers 404 SHARE_LINK_NOT_AVAILABLE).
          example: https://app.ingfah.ai/share/q8Zr3mWkP0aT7vYxN2cL5hJ9sD1fG4bE6uR8iO0pQwA
          nullable: true
          type: string
        view_count:
          description: Successful opens; 0 right after a create.
          example: 0
          type: integer
      required:
      - id
      - resource_type
      - resource_id
      - kind
      - status
      - created_at
      - created_by
      - view_count
      type: object
    SharelinksRevokeResponse:
      properties:
        id:
          example: 31
          minimum: 0
          type: integer
        status:
          description: The link's status after the call; expired only for a link that
            expired and was never revoked (nothing was saved).
          enum:

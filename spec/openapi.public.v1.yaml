    get:
      description: |-
        One row per outbound call attempt, from record picked to dial through the SIP leg's start/answer/end, newest first. Filter by from/to and/or batch_id (outbound_batches.client_batch_id); from/to are required together unless batch_id is given, and their range cannot exceed 93 days. A finished attempt that never reached SIP (e.g. dispatch_timeout) has null sip_* fields.


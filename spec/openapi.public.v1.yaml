    patch:
      description: |-
        Changes a phone tool of the client. Only the keys sent change. A global tool, or a kind the client may not edit, is a 403; another client's tool is a 404. Every edit writes an activity log row `phone_tool.update`; a rejected one changes nothing.

        Task (Goal, Troubleshoot, Form): `name`, `description` and keys of `params` the catalog lists for its kind, at least one of them. Each `params` key sent replaces that key whole; `null` removes it. The task as it will be is checked like a new one, so a value stored outside the rules must be sent too before another edit saves. `extra_tools` is checked only when sent. A new name must not be used by another phone tool or Tool (MCP) of the client, or a global one (`PHONE_TOOL_NAME_TAKEN`). The voice settings set by the ingfah team cannot be sent and never change. The kind cannot change: `implementation_name` is a 400.

        Warm transfer: only the numbers, the waits and the 3 messages. `null` sets a key back to its empty value (off, 1 round, no limit, silent). A message the client saves is spoken word for word. With more than one number, `ring_timeout_seconds` is required. The numbers are always saved as `target_phone_numbers`, so a list the ingfah team stored outside these rules must be sent again before any other edit saves. SIP and the other settings of the ingfah team cannot be sent and never change.

        API key scope: `ai_agents:write`.
      operationId: updatePhoneTool
      parameters:
      - description: The phone tool's id.
        in: path
        name: id
        required: true
        schema:
          description: The phone tool's id.
          example: 640
          minimum: 0
          type: integer
      requestBody:
        content:
          application/json:
            examples:
              task:
                summary: task
                value:
                  description: ใช้เมื่อลูกค้าบอกว่าเปลี่ยนเบอร์
                  params:
                    fields:
                    - ask: ขอชื่อผู้ติดต่อค่ะ
                      name: contact_name
                      required: true
                      type: text
                    - ask: ขอเบอร์มือถือที่ติดต่อได้ค่ะ
                      name: contact_phone
                      required: true
                      say_as: thai_number_as_digit
                      type: phone_th
                    rules: null
              warm_transfer:
                summary: warm transfer
                value:
                  params:
                    ring_timeout_seconds: 20
                    target_phone_numbers:
                    - "0811112222"
                    - "1102"
            schema:
              $ref: '#/components/schemas/UpdatePhoneToolBody'
      responses:
        "200":
          content:
            application/json:
              examples:
                task:
                  summary: task
                  value:
                    data:
                      client_id: 101
                      description: ใช้เมื่อลูกค้าบอกว่าเปลี่ยนเบอร์
                      id: 5
                      implementation_name: form_task
                      name: collect_contact
                      params:
                        confirm:
                          fields:
                          - contact_phone
                        fields:
                        - ask: ขอชื่อผู้ติดต่อค่ะ
                          name: contact_name
                          required: true
                          type: text
                        - ask: ขอเบอร์มือถือที่ติดต่อได้ค่ะ
                          name: contact_phone
                          required: true
                          say_as: thai_number_as_digit
                          type: phone_th
                        intro: ขอเก็บข้อมูลติดต่อใหม่นะคะ
                        on_result:
                          success: ขอบคุณลูกค้า แล้วคุยเรื่องยอดค้างต่อ
                    status: success
                warm_transfer:
                  summary: warm transfer
                  value:
                    data:
                      client_id: 101
                      description: โอนสายให้เจ้าหน้าที่ call center
                      id: 5
                      implementation_name: warm_transfer_to_human
                      name: warm_transfer_to_call_center
                      params:
                        ring_timeout_seconds: 20
                        target_phone_numbers:
                        - "0811112222"
                        - "1102"
                        timeout_seconds: 60
                    status: success
              schema:
                $ref: '#/components/schemas/PhoneToolData'
          description: OK
        "400":
          content:
            application/json:
              examples:
                name_taken:
                  summary: name taken
                  value:
                    error: bad request
                    errors:
                    - code: PHONE_TOOL_NAME_TAKEN
                      detail: name confirm_purchase is already used by another tool
                    status: error
                ring_timeout:
                  summary: ring timeout
                  value:
                    error: invalid request
                    status: error
                voice_key:
                  summary: voice key
                  value:
                    error: invalid request
                    status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Bad Request
        "401":
          content:
            application/json:
              example:
                error: unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Unauthorized
        "403":
          content:

      - in: path
        name: id
        required: true
        schema:
          example: 12
          minimum: 0
          type: integer
      - description: 'true: the preview. The same checks, counts and errors, but nothing
          is saved, no row lock is taken and no activity log is written.'
        in: query
        name: dry_run
        schema:
          description: 'true: the preview. The same checks, counts and errors, but
            nothing is saved, no row lock is taken and no activity log is written.'

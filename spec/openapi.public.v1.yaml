    PhonetoolsFormField:
      properties:
        ask:
          description: How to ask the caller for the field.
          example: ขอเบอร์โทรที่ติดต่อได้ค่ะ
          type: string
        checksum:
          description: A check the digits must pass.
          enum:
          - th_national_id
          type: string
        collect:
          description: Spoken, or keyed on the keypad (digits or phone_th only). Default

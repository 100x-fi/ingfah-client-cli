          example: "0931248901"
          nullable: true
          type: string
      - description: Only rows whose call_attempts + callback_attempts is one of these,
          comma separated.
        in: query
        name: call_attempts
        schema:
          description: Only rows whose call_attempts + callback_attempts is one of
            these, comma separated.
          example: 2,3
          nullable: true
          type: string
      - description: Only rows whose latest call started at or after this RFC3339
          time; rows with no call never match.
        in: query
        name: call_time_from
        schema:
          description: Only rows whose latest call started at or after this RFC3339
            time; rows with no call never match.
          example: "2026-06-25T05:00:00Z"
          nullable: true
          type: string
      - description: Only rows whose latest call started at or before this RFC3339

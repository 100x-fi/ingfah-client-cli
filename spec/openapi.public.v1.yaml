    TtsdictionariesImportRow:
      properties:
        code:
          description: The first check the row fails; lengths are 1 to 1,000 characters
            after trimming.
          enum:
          - WORD_EMPTY
          - PRONUNCIATION_EMPTY
          - WORD_TOO_LONG
          - PRONUNCIATION_TOO_LONG
          - DUPLICATE_IN_FILE
          example: PRONUNCIATION_EMPTY
          type: string
        duplicate_of_row:
          description: 'Only with DUPLICATE_IN_FILE: the earlier row with the same
            word, as typed (US and us are two words).'
          example: 4
          nullable: true
          type: integer
        row:
          description: The row's line in the file; the header is row 1.
          example: 7

  /client/tts-dictionaries:
    get:
      description: |-
        One page of the sets the caller's client sees: its own sets first, then global sets; inside each group the most recently updated first (the order in which sets win), the same on every page; sort_by orders all the sets instead, the client's and global ones mixed. With search and no sort_by, the sets whose name matches come first (own, then global), then those found only by a word or pronunciation (own, then global). team_count and teams cover the non-deleted teams of the caller's client bound to the set, also for a global set; never another client's teams. is_global and client_product_id narrow the list, together with search; total counts what they keep. A page past the end answers data: [].

        API key scope: `tts_dictionaries:read`.
      operationId: listTtsDictionaries
      parameters:
      - description: From 1. Defaults to 1.
        in: query
        name: page
        schema:
          description: From 1. Defaults to 1.
          nullable: true
          type: integer
      - description: 1 to 100. Defaults to 20.
        in: query
        name: per_page
        schema:
          description: 1 to 100. Defaults to 20.
          nullable: true
          type: integer
      - description: 'Part of the set name, or of a word or pronunciation in the set,
          ignoring case; % _ and \ match themselves; trimmed; empty means no filter.
          The list shows the matching sets only, never their words: GET /client/tts-dictionaries/{id}/words
          with the same search lists the words that match.'
        in: query
        name: search
        schema:
          description: 'Part of the set name, or of a word or pronunciation in the
            set, ignoring case; % _ and \ match themselves; trimmed; empty means no
            filter. The list shows the matching sets only, never their words: GET
            /client/tts-dictionaries/{id}/words with the same search lists the words
            that match.'
          nullable: true
          type: string
      - description: 'true: only global sets; false: only the client''s own sets.
          Omitted keeps both. Anything but true or false is a 400.'
        in: query
        name: is_global
        schema:
          description: 'true: only global sets; false: only the client''s own sets.
            Omitted keeps both. Anything but true or false is a 400.'
          example: false
          nullable: true
          type: boolean
      - description: Only the sets bound to any of these teams; repeat the parameter
          for several. Only the caller's client's non-deleted teams count, so another
          client's or an unknown team matches nothing. Needs client_products:read
          with an API key (403 otherwise).
        in: query
        name: client_product_id
        schema:
          description: Only the sets bound to any of these teams; repeat the parameter
            for several. Only the caller's client's non-deleted teams count, so another
            client's or an unknown team matches nothing. Needs client_products:read
            with an API key (403 otherwise).
          example: 3
          items:
            minimum: 0
            type: integer
          type: array
      - description: What to order all the sets by, the client's and global ones mixed.
          name ignores case. Ties go most recently updated first. Omitted keeps the
          winning order, or with search the sets whose name matches first. Anything
          else is a 400.
        in: query
        name: sort_by
        schema:
          description: What to order all the sets by, the client's and global ones
            mixed. name ignores case. Ties go most recently updated first. Omitted
            keeps the winning order, or with search the sets whose name matches first.
            Anything else is a 400.
          enum:
          - name
          - created_at
          - updated_at
          - word_count
          example: name
          nullable: true
          type: string
      - description: Defaults to desc. Only used with sort_by. Anything else is a
          400.
        in: query
        name: sort_direction
        schema:
          description: Defaults to desc. Only used with sort_by. Anything else is
            a 400.
          enum:
          - asc
          - desc
          example: asc
          nullable: true
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - created_admin: null
                  created_at: "2026-09-02T09:01:00Z"
                  id: 12
                  is_global: false
                  name: โปรโมชัน
                  team_count: 1
                  teams:
                  - ai_agents: []
                    id: 3
                    name: ผ่อนมือถือ
                    slug: ingfah-agent-example
                  updated_admin: null
                  updated_at: "2026-09-05T12:04:00Z"
                  word_count: 2

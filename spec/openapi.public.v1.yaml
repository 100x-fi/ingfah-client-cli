      parameters:
      - description: The phone tool's id.
        in: path
        name: id
        required: true
        schema:
          description: The phone tool's id.
          example: 640
          minimum: 0
          type: integer
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  id: 813
                  status: deleted
                status: success
              schema:
                $ref: '#/components/schemas/DeletePhoneToolResponseData'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Bad Request
        "401":
          content:
            application/json:
              example:
                error: unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                error: forbidden
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                error: resource not found
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Not Found
        "409":
          content:
            application/json:
              example:
                data:
                  agents:
                  - id: 101
                    name: ทวงยอด
                    profile_url: null
                    slug: ingfah-agent-example
                error: conflict
                errors:
                - code: PHONE_TOOL_IN_USE
                  detail: phone tool is used by 1 agent(s); remove it from every agent
                    first
                status: error
              schema:
                $ref: '#/components/schemas/ContractError'
          description: Conflict
      security:
      - apiKey: []
      summary: Delete a task
      tags:
      - Phone tools
    get:
      description: |-
        One phone tool of the client, or a global one. For a task, `params` holds only the keys the catalog lists for its kind; for a warm transfer, only the 8 keys a client may edit, with the numbers always as `target_phone_numbers`. The voice and SIP settings set by the ingfah team are never shown. Another client's tool is not found.

        API key scope: `ai_agents:read`.
      operationId: getPhoneTool
      parameters:
      - description: The phone tool's id.
        in: path
        name: id
        required: true
        schema:
          description: The phone tool's id.
          example: 640
          minimum: 0
          type: integer
      responses:
        "200":
